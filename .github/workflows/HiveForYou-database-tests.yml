# HiveForYou V4 — local Supabase database verification (pgTAP + paste checks).
# Uses an isolated `supabase db start` stack only; never links to or reads production secrets.

name: HiveForYou Database Tests

on:
  push:
    paths:
      - ".github/workflows/HiveForYou-database-tests.yml"
      - "scripts/assert-app-rpc-coverage.mjs"
      - "supabase/**"
  pull_request:
    paths:
      - ".github/workflows/HiveForYou-database-tests.yml"
      - "scripts/assert-app-rpc-coverage.mjs"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiveforyou-database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Migrations + pgTAP + check SQL
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (RPC coverage script)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert app RPCs are listed for rpc_smoke_check.sql
        run: node scripts/assert-app-rpc-coverage.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start isolated local database
        shell: bash
        run: |
          set -euo pipefail
          supabase db start

      - name: Apply all migrations (db reset)
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase db reset --no-seed; then
            echo "::error title=Migration apply failed::supabase db reset reported errors."
            exit 1
          fi
          supabase migration list --local

      - name: Discover and run pgTAP (*.test.sql)
        id: pgtap
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR=supabase/tests/database
          HELPER="$TEST_DIR/pg_fixture_helpers.sql"
          shopt -s nullglob
          mapfile -t FOUND < <(find "$TEST_DIR" -maxdepth 1 -name '*.test.sql' | sort)
          shopt -u nullglob
          if [ "${#FOUND[@]}" -eq 0 ]; then
            echo "::error title=No pgTAP files::No *.test.sql under $TEST_DIR."
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Discovered ${#FOUND[@]} pgTAP file(s)."
          MERGED=()
          for f in "${FOUND[@]}"; do
            tmp="$RUNNER_TEMP/pgtap-$(basename "$f")"
            { cat "$HELPER"; echo; cat "$f"; } > "$tmp"
            MERGED+=("$tmp")
          done
          set +e
          supabase test db "${MERGED[@]}" 2>&1 | tee "$RUNNER_TEMP/pgtap.log"
          test_exit=${PIPESTATUS[0]}
          set -e
          pgtap_failed=false
          if [ "$test_exit" -ne 0 ]; then
            echo "::error title=pgTAP failed::exit $test_exit"
            pgtap_failed=true
          elif ! grep -q 'All tests successful' "$RUNNER_TEMP/pgtap.log"; then
            echo "::error title=pgTAP incomplete::Expected 'All tests successful'."
            pgtap_failed=true
          else
            echo "pgTAP OK: ${#FOUND[@]} file(s)."
          fi
          if [ "$pgtap_failed" = true ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover and run check SQL (*_check.sql)
        id: check_sql
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR=supabase/tests/database
          shopt -s nullglob
          mapfile -t CHECKS < <(find "$TEST_DIR" -maxdepth 1 -name '*_check.sql' | sort)
          shopt -u nullglob
          if [ "${#CHECKS[@]}" -eq 0 ]; then
            echo "::error title=No check files::No *_check.sql under $TEST_DIR."
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Discovered ${#CHECKS[@]} check file(s)."
          DB_URL_RAW="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '\r')"
          DB_URL="${DB_URL_RAW#\"}"
          DB_URL="${DB_URL%\"}"
          if [ -z "$DB_URL" ]; then
            echo "::error title=No DB_URL::Could not read DB_URL from supabase status."
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$DB_URL" =~ @([^:/?#]+) ]]; then
            echo "psql target host: ${BASH_REMATCH[1]}"
          else
            echo "::error title=Invalid DB_URL::Could not parse host from DB_URL."
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; then
            echo "::error title=psql connect failed::Could not connect with DB_URL from supabase status."
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          checks_failed=false
          ran=0
          for f in "${CHECKS[@]}"; do
            ran=$((ran + 1))
            echo "## Running $f"
            out="$RUNNER_TEMP/$(basename "$f").log"
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" >"$out" 2>&1; then
              cat "$out"
              echo "::error title=Check SQL failed::$f"
              checks_failed=true
            elif ! grep -q 'ALL CHECKS PASSED' "$out"; then
              cat "$out"
              echo "::error title=Check SQL missing success::$f did not print ALL CHECKS PASSED"
              checks_failed=true
            fi
          done
          if [ "$ran" -ne "${#CHECKS[@]}" ]; then
            echo "::error title=Check count mismatch::ran=$ran found=${#CHECKS[@]}"
            checks_failed=true
          elif [ "$checks_failed" = false ]; then
            echo "Check SQL OK: ${#CHECKS[@]} file(s)."
          fi
          if [ "$checks_failed" = true ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail job if pgTAP or check SQL failed
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          pgtap_failed="${{ steps.pgtap.outputs.failed }}"
          check_failed="${{ steps.check_sql.outputs.failed }}"
          if [ "$pgtap_failed" = "true" ] || [ "$check_failed" = "true" ]; then
            echo "::error title=Database verification failed::pgTAP failed=${pgtap_failed:-unknown}, check SQL failed=${check_failed:-unknown}"
            exit 1
          fi