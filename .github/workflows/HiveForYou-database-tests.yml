# HiveForYou V4 — local Supabase database verification (pgTAP).
# Uses an isolated `supabase db start` stack only; never links to or reads production secrets.
#
# V4-004 Batch 1: apply the full migration chain, then run study_preparation.test.sql (41 assertions).

name: HiveForYou Database Tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/HiveForYou-database-tests.yml"
      - "supabase/**"
  pull_request:
    paths:
      - ".github/workflows/HiveForYou-database-tests.yml"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiveforyou-database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study-preparation-pgtap:
    name: Migrations + study preparation pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Discover local migration chain
        shell: bash
        run: |
          set -euo pipefail
          MIG_DIR=supabase/migrations
          if [ ! -d "$MIG_DIR" ]; then
            echo "::error title=Missing migrations::Expected directory $MIG_DIR."
            exit 1
          fi
          shopt -s nullglob
          sql_files=( "$MIG_DIR"/*.sql )
          shopt -u nullglob
          if [ "${#sql_files[@]}" -eq 0 ]; then
            echo "::error title=No migrations::No .sql files in $MIG_DIR."
            exit 1
          fi
          echo "## Local migration chain (sorted)"
          for f in "${sql_files[@]}"; do
            base="$(basename "$f")"
            if ! [[ "$base" =~ ^([0-9]{14})_.+\.sql$ ]]; then
              echo "::error title=Invalid migration filename::Expected {14-digit-timestamp}_name.sql; got $base."
              exit 1
            fi
            echo "- $base"
          done | sort

      - name: Start isolated local database
        shell: bash
        run: |
          set -euo pipefail
          echo "## Starting local Supabase database (Docker)"
          supabase db start

      - name: Apply all migrations (db reset)
        shell: bash
        run: |
          set -euo pipefail
          echo "## Applying migrations via supabase db reset --no-seed"
          if ! supabase db reset --no-seed; then
            echo "::error title=Migration apply failed::supabase db reset reported errors. See log above."
            exit 1
          fi
          echo "## Local migration history after reset"
          supabase migration list --local

      - name: Run study_preparation pgTAP (41 planned assertions)
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE=supabase/tests/database/study_preparation.test.sql
          if [ ! -f "$TEST_FILE" ]; then
            echo "::error title=Missing test file::Expected $TEST_FILE."
            exit 1
          fi
          if ! grep -q 'SELECT plan(41);' "$TEST_FILE"; then
            echo "::error title=Assertion count mismatch::$TEST_FILE must contain SELECT plan(41);"
            exit 1
          fi
          echo "## Running pgTAP: $TEST_FILE"
          set +e
          supabase test db "$TEST_FILE" 2>&1 | tee "$RUNNER_TEMP/pgtap-study-preparation.log"
          test_exit=${PIPESTATUS[0]}
          set -e
          echo "## pgTAP summary"
          grep -E '^(ok|not ok|# Looks like|All tests successful|Files=|Result:)' "$RUNNER_TEMP/pgtap-study-preparation.log" || true
          if [ "$test_exit" -ne 0 ]; then
            echo "::error title=pgTAP failed::study_preparation.test.sql did not pass (exit $test_exit). Failing assertions and migration errors are in the job log above."
            exit "$test_exit"
          fi
          if ! grep -q 'All tests successful' "$RUNNER_TEMP/pgtap-study-preparation.log"; then
            echo "::error title=pgTAP incomplete::Expected 'All tests successful' in test output."
            exit 1
          fi
          echo "Verified: all 41 planned pgTAP assertions passed on commit ${GITHUB_SHA}."
