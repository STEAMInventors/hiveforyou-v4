# HiveForYou V4 — deploy Supabase Edge Functions (V4-002: v1-hives only).
# Does not run SQL migrations or modify database schema.

name: HiveForYou Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/HiveForYou-deploy-edge-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiveforyou-deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy-v1-hives:
    name: Deploy v1-hives
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets and JWT configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing secret::Configure the SUPABASE_ACCESS_TOKEN repository secret (Supabase account access token)."
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error title=Missing secret::Configure the SUPABASE_PROJECT_ID repository secret (V4 Supabase project reference id)."
            exit 1
          fi

          CONFIG="supabase/config.toml"
          if [ ! -f "$CONFIG" ]; then
            echo "::error title=Missing config::Expected $CONFIG at repository root."
            exit 1
          fi

          if ! grep -q '^\[functions\.v1-hives\]' "$CONFIG"; then
            echo "::error title=Invalid config::Missing [functions.v1-hives] in $CONFIG."
            exit 1
          fi

          if ! awk '
            /^\[functions\.v1-hives\]/ { in_section=1; next }
            /^\[/ { if (in_section) exit }
            in_section && /^verify_jwt = true/ { found=1; exit }
            END { exit(found ? 0 : 1) }
          ' "$CONFIG"; then
            echo "::error title=JWT verification disabled or missing::v1-hives must set verify_jwt = true in $CONFIG. Do not deploy with --no-verify-jwt."
            exit 1
          fi

          echo "Configuration check passed: v1-hives verify_jwt = true."

          if [ ! -f "supabase/functions/v1-hives/index.ts" ]; then
            echo "::error title=Missing function::Expected supabase/functions/v1-hives/index.ts."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy v1-hives Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy v1-hives --project-ref "$SUPABASE_PROJECT_ID"
          echo "Deployed v1-hives to project ref (redacted)."
