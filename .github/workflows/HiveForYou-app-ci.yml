# HiveForYou V4 — application CI (typecheck, lint, unit tests, production build).

name: HiveForYou App CI

on:
  push:
    paths:
      - ".github/workflows/HiveForYou-app-ci.yml"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/HiveForYou-app-ci.yml"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiveforyou-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm test

      - name: Production build
        run: npm run build