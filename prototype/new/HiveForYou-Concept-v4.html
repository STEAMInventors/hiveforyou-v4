<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiveForYou — concept v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* HiveForYou concept v4 — "the file explains itself". Brand guide v1.0 colours and faces. */
:root {
  --ink: #1f2328; --ink-2: #4a525c; --ink-3: #6b737d;
  --line: #e3e6ea; --line-2: #d3d8de; --mist: #f4f6f8; --paper: #fff; --hover: #eef1f4;
  --blue: #3b7cf6; --blue-deep: #1a56c4; --blue-wash: #e8f0fe;
  --coral: #ef5143; --coral-deep: #b33a2e; --coral-wash: #fdedeb;
  --honey: #f6b826; --honey-deep: #7a5200; --honey-wash: #fef3d6;
  --leaf: #2fa35a; --leaf-deep: #197040; --leaf-wash: #e6f4ea;
  --display: "Outfit", system-ui, sans-serif; --body: "DM Sans", system-ui, sans-serif; --page: "Source Serif 4", Georgia, serif;
  --lift: 0 1px 2px rgba(16,24,40,.05), 0 12px 32px -16px rgba(16,24,40,.18);
  --pop: 0 2px 6px rgba(16,24,40,.06), 0 24px 56px -20px rgba(16,24,40,.28);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14.5px/1.55 var(--body); -webkit-font-smoothing: antialiased; letter-spacing: -0.003em; }
::selection { background: #cfe0fd; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.meta { font-size: 12.5px; color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--paper); font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.primary:hover { background: #1647a3; }
.btn.text { border-color: transparent; background: none; color: var(--blue-deep); padding: 0 6px; }
.btn.text:hover { background: var(--blue-wash); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); }
.btn.quiet:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }

/* Status: dot + word */
.dot { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.dot.coral { color: var(--coral-deep); } .dot.honey { color: var(--honey-deep); } .dot.honey::before { background: var(--honey); }
.dot.blue { color: var(--blue-deep); } .dot.leaf { color: var(--leaf-deep); } .dot.grey { color: var(--ink-3); }

/* Source reference */
.ref { display: inline-flex; align-items: center; gap: 5px; height: 24px; max-width: 100%; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; opacity: .7; flex: none; }
.ref .pg { color: var(--ink-3); }
.ref:hover { background: var(--blue-wash); border-color: #c9d9fb; color: var(--blue-deep); }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* Avatars */
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; flex: none; }
.av.client { background: var(--leaf-wash); color: var(--leaf-deep); box-shadow: inset 0 0 0 1px rgba(25,112,64,.18); }
.av.staff { background: var(--blue-wash); color: var(--blue-deep); box-shadow: inset 0 0 0 1px rgba(26,86,196,.16); }
.av.ai { background: var(--ink); }
.av.ai svg { width: 14px; height: 18px; }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.stack { display: flex; }
.stack .av { box-shadow: 0 0 0 2px var(--paper); }
.stack .av + .av { margin-left: -6px; }

/* ── Top bar with the one input ── */
.top { position: sticky; top: 0; z-index: 40; display: grid; grid-template-columns: 1fr minmax(0, 600px) 1fr; align-items: center; gap: 16px; height: 64px; padding: 0 20px; background: rgba(255,255,255,.9); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 9px; border: 0; background: none; padding: 0; font-family: var(--display); font-size: 18px; letter-spacing: -0.035em; }
.brand b { font-weight: 600; } .brand span { font-weight: 400; }
.brand svg { width: 21px; height: 26px; }
.brand svg polygon { stroke: #fff; stroke-width: 2.5; stroke-linejoin: round; }
.left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.path { display: flex; white-space: nowrap; align-items: center; gap: 6px; min-width: 0; font-size: 13.5px; color: var(--ink-3); }
.path .sep { color: var(--line-2); }
.path b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.viewas { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--mist); font-size: 12.5px; }
.viewas button { height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 500; }
.viewas button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(16,24,40,.06); }
.me { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; }

.omni { position: relative; min-width: 0; }
.omni-box { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 8px 0 14px; border-radius: 12px; background: var(--mist); border: 1px solid transparent; transition: background .12s, border-color .12s, box-shadow .12s; }
.omni-box:hover { background: #eef1f4; }
.omni.open .omni-box, .omni-box:focus-within { background: var(--paper); border-color: var(--line-2); box-shadow: var(--lift); }
.omni-box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 14.5px; }
.omni-box input::placeholder { color: var(--ink-3); }
.omni-box .icon { color: var(--ink-3); }
.kbd { font-size: 11.5px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 6px; line-height: 18px; background: var(--paper); }
.omni-pop { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--pop); max-height: min(70vh, 640px); overflow-y: auto; padding: 8px; animation: rise .18s cubic-bezier(.16,1,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.omni-group { padding: 6px 4px; }
.omni-group + .omni-group { border-top: 1px solid var(--line); }
.omni-group h4 { margin: 4px 8px 6px; font: 600 12px var(--body); color: var(--ink-3); }
.hit { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: start; width: 100%; padding: 8px; border: 0; border-radius: 9px; background: none; text-align: left; font-size: 13.5px; line-height: 1.45; }
.hit:hover, .hit[aria-selected="true"] { background: var(--mist); }
.hit .icon { margin-top: 2px; color: var(--ink-3); }
.hit small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 1px; }
.hit mark { background: #fff1bf; color: inherit; border-radius: 2px; padding: 0 1px; }
.hit.ask { grid-template-columns: 26px 1fr auto; align-items: center; }
.hit.ask .av { width: 24px; height: 24px; }
.hit.ask .av svg { width: 11px; height: 14px; }
.answer { padding: 12px 10px 6px; }
.answer .q { font-weight: 600; margin-bottom: 10px; }
.answer .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; }
.answer .who b { color: var(--ink); font-size: 13.5px; }
.tag { white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; line-height: 17px; }
.answer .text { font-size: 14.5px; line-height: 1.6; }
.answer .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.typing { display: inline-flex; gap: 3px; margin-left: 4px; }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ── Hive header ── */
.hivehead { max-width: 1240px; margin: 0 auto; padding: 28px 32px 0; }
.hh-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.hh-row h1 { font-size: 28px; line-height: 1.15; }
.hh-row .sub { margin-top: 6px; color: var(--ink-3); font-size: 14px; }
.people { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); }
.tabs { display: flex; gap: 26px; margin-top: 20px; border-bottom: 1px solid var(--line); }
.tabs button { position: relative; height: 42px; padding: 0; border: 0; background: none; font-size: 14px; font-weight: 500; color: var(--ink-3); display: inline-flex; align-items: center; gap: 7px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }
.tabs .c { font-size: 11.5px; font-weight: 600; color: var(--ink-3); background: var(--mist); border-radius: 9px; padding: 1px 7px; }
.tabs .lock { width: 13px; height: 13px; }

/* ── Home ── */
.home { max-width: 1240px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 48px; }
.brief { padding: 32px 0 96px; min-width: 0; }
.state { font-family: var(--display); font-size: 23px; line-height: 1.35; letter-spacing: -0.02em; font-weight: 500; color: var(--ink); max-width: 640px; }
.state em { font-style: normal; color: var(--ink-3); }
.meter { display: flex; gap: 3px; margin: 18px 0 8px; max-width: 420px; }
.meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--leaf); }
.sec { margin-top: 40px; }
.sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.sec h2 { font-size: 17px; letter-spacing: -0.015em; }
.step { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--line); }
.step .t { font-weight: 600; font-size: 14.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.step .d { grid-column: 1; color: var(--ink-2); font-size: 13.5px; }
.step .a { grid-row: 1 / span 2; grid-column: 2; }
.topic { margin-top: 22px; }
.topic h3 { font: 600 13.5px var(--body); color: var(--ink-3); margin-bottom: 4px; display: flex; gap: 10px; align-items: center; }
.claim { display: block; cursor: pointer; text-align: left; padding: 10px 12px; margin: 0 -12px; border-radius: 10px; font-size: 14.5px; line-height: 1.55; transition: background .12s; }
.claim:hover { background: var(--mist); }
.claim:hover .go { opacity: 1; }
.claim .go { opacity: 0; color: var(--blue-deep); font-size: 12.5px; font-weight: 600; margin-left: 6px; transition: opacity .12s; white-space: nowrap; }
.claim .refs { margin-top: 6px; pointer-events: none; }
.more { margin: 6px 0 0 -6px; }

/* Conversation panel */
.convo { position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px); display: flex; flex-direction: column; border-left: 1px solid var(--line); padding: 24px 0 16px 28px; }
.convo-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.convo-h h2 { font-size: 16px; }
.convo-h p { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.thread { flex: 1; overflow-y: auto; padding: 8px 4px 8px 0; }
.msg { display: grid; grid-template-columns: 30px 1fr; gap: 11px; padding: 12px 0; }
.by { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 12px; color: var(--ink-3); }
.by b { font-size: 13.5px; color: var(--ink); font-weight: 600; }
.msg .text { margin-top: 2px; font-size: 14px; line-height: 1.55; color: #2a2f35; white-space: pre-wrap; }
.day { text-align: center; font-size: 11.5px; color: var(--ink-3); margin: 6px 0; }
.composer { border: 1px solid var(--line-2); border-radius: 12px; background: var(--paper); box-shadow: 0 1px 2px rgba(16,24,40,.04); transition: border-color .12s, box-shadow .12s; }
.composer:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,124,246,.14); }
.composer textarea { display: block; width: 100%; min-height: 52px; max-height: 160px; resize: none; border: 0; outline: 0; background: none; padding: 12px 14px 4px; font-size: 14px; }
.composer .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px 8px 14px; }
.composer .hint { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.composer .hint .icon { width: 13px; height: 13px; }

/* ── Evidence split ── */
.split { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); min-height: calc(100vh - 64px); }
.claimside { padding: 28px 32px 64px; border-right: 1px solid var(--line); overflow-y: auto; }
.back { margin-left: -8px; }
.claimside .big { font-family: var(--display); font-size: 21px; line-height: 1.4; font-weight: 500; letter-spacing: -0.015em; margin: 18px 0 14px; }
.claimside h4 { margin: 22px 0 6px; font: 600 12.5px var(--body); color: var(--ink-3); }
.claimside .others { display: flex; flex-direction: column; gap: 6px; }
.claimside .others button { display: flex; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); text-align: left; font-size: 13px; }
.claimside .others button[aria-current="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.claimside .others button:hover { background: var(--mist); }
.decide { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.decided { margin-top: 10px; }
.viewer { background: var(--mist); padding: 28px 32px 64px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.vbar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-2); }
.vbar b { color: var(--ink); }
.page { width: 100%; max-width: 680px; aspect-ratio: 8.5 / 11; background: #fffefb; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 18px 40px -22px rgba(0,0,0,.3); padding: 56px 60px; font-family: var(--page); color: #2a2a2a; font-size: 14.5px; line-height: 1.7; overflow: hidden; animation: pagein .35s cubic-bezier(.16,1,.3,1); }
@keyframes pagein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.page .org { font-family: var(--body); font-size: 11.5px; letter-spacing: .02em; color: #8a8f96; display: flex; justify-content: space-between; border-bottom: 1px solid #ece9e2; padding-bottom: 10px; margin-bottom: 26px; }
.page .ln { height: 9px; border-radius: 5px; background: #efece6; margin: 13px 0; }
.page .hl { display: block; margin: 18px -10px; padding: 10px; border-radius: 4px; background: #fff1bf; box-shadow: 0 0 0 1px #f3d97a; font-size: 15.5px; color: #1f1f1f; }
.page .unread { display: grid; place-items: center; height: 60%; color: #8a8f96; font-family: var(--body); font-size: 13.5px; text-align: center; filter: blur(0); }

/* ── Documents / Report / Notes ── */
.pagewrap { max-width: 1040px; margin: 0 auto; padding: 28px 32px 96px; }
.pagewrap.read { max-width: 760px; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 10px 12px 10px 0; border-bottom: 1px solid var(--ink); }
.table td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.table .s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.table td.n, .table th.n { text-align: right; font-variant-numeric: tabular-nums; }
.table tbody tr { cursor: pointer; }
.table tbody tr:hover td { background: #fafbfc; }
.paper { margin-top: 20px; border: 1px solid var(--line); border-radius: 4px; padding: 48px 56px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 16px 40px -24px rgba(16,24,40,.22); }
.paper h2 { font-size: 24px; margin: 10px 0 8px; }
.paper h3 { font-size: 15px; margin: 26px 0 6px; }
.paper p { margin: 6px 0; }
.note { padding: 14px 0; border-bottom: 1px solid var(--line); }

/* ── Client home (phone first) ── */
.cl { max-width: 460px; margin: 0 auto; padding: 22px 20px 120px; }
.cl-who { display: flex; align-items: center; gap: 12px; }
.cl-who p { font-size: 13px; color: var(--ink-3); }
.cl-who b { display: block; font-size: 14.5px; color: var(--ink); }
.cl h1 { font-size: 26px; line-height: 1.2; margin: 22px 0 6px; }
.cl .lead { color: var(--ink-2); font-size: 15px; }
.cl .meter { max-width: none; margin-top: 16px; }
.cl-sec { margin-top: 30px; }
.cl-sec > h2 { font-size: 16px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; }
.cl-sec > h2 span { font: 500 12.5px var(--body); color: var(--ink-3); }
.ask-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ask-row p { font-size: 14.5px; line-height: 1.45; }
.ask-row small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.ask-row .btn { height: 44px; min-width: 76px; }
.ask-row.done p { color: var(--ink-3); }
.cl-ask { margin-top: 26px; display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--paper); text-align: left; color: var(--ink-3); font-size: 15px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
.cl-ask .av { width: 26px; height: 26px; }
.cl-ask .av svg { width: 12px; height: 15px; }
.cl-ask:hover { border-color: var(--ink-3); }
.cl .thread { overflow: visible; padding: 0; }
.privacy { display: flex; gap: 8px; align-items: flex-start; margin-top: 22px; font-size: 12.5px; color: var(--ink-3); }
.privacy .icon { width: 14px; height: 14px; margin-top: 2px; }
.sheet-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(20,26,34,.32); }
.sheet { position: fixed; z-index: 61; left: 50%; bottom: 0; transform: translateX(-50%); width: min(560px, 100vw); max-height: 88vh; display: flex; flex-direction: column; background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: var(--pop); animation: up .26s cubic-bezier(.16,1,.3,1); }
@keyframes up { from { transform: translate(-50%, 24px); opacity: .6; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
.sheet header h2 { font-size: 16px; }
.sheet .body { padding: 0 18px 12px; overflow-y: auto; }
.sheet .foot { padding: 10px 14px 16px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--pop); }

@media (max-width: 1099px) {
  .home { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .convo { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); padding: 24px 0 96px; }
  .convo .thread { overflow: visible; }
  .split { grid-template-columns: minmax(0, 1fr); }

function highlight(text, q) {
  const t = esc(text); if (!q) return t;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? t : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}

function searchHits(q) {
  const ql = q.trim().toLowerCase();
  if (!ql) return { claims: [], docs: [], items: [] };
  const claims = []; S.understand.groups.forEach((g) => g.items.forEach((it) => { if (it.text.toLowerCase().includes(ql)) claims.push({ ...it, topic: g.title }); }));

  const items = S.exceptions.filter((x) => !x.hidden && (x.title + " " + x.detail).toLowerCase().includes(ql));
  return { claims: claims.slice(0, 4), docs: docs.slice(0, 3), items: items.slice(0, 3) };
}

    const a = state.answer;

  }

  const list = [];
  const group = (title, rows) => rows.length ? `<div class="omni-group"><h4>${title}</h4>${rows.join("")}</div>` : "";
  const claimRows = h.claims.map((c) => { list.push({ ev: c.ev[0] }); return `<button class="hit" data-ev="${c.ev[0]}">${icon("doc")}<span>${highlight(c.text, q)}<small>${esc(c.topic)}</small></span><span class="meta">p.${ev(c.ev[0])?.page ?? ""}</span></button>`; });
  const itemRows = h.items.map((x) => `<button class="hit" data-ev="${x.ev[0]}" data-item="${x.id}">${icon("flag")}<span>${highlight(x.title, q)}<small>${x.kind === "missing" ? "Still to come" : "To decide"}</small></span><span></span></button>`);
  const docRows = h.docs.map((d) => { const e = Object.entries(S.ev).find(([, v]) => v.doc === d.id); return `<button class="hit" ${e ? `data-ev="${e[0]}"` : ""}>${icon("doc")}<span>${highlight(d.role, q)}<small>${esc(d.type)} · ${esc(d.period)}</small></span><span class="meta num">${d.pages} pp</span></button>`; });
  const suggestions = state.who === "client"
    ? ["What's still missing?", "Why do you need the 2023 statements?", "Should I qualify for Medicaid?"]
    : ["What's still missing?", "Which transfers left the accounts?", "Was the savings account open in 2022?"];
  const askRow = `<div class="omni-group"><button class="hit ask" data-act="ask">${avatar("ai")}<span>${q ? `Ask ${P.assistant}: <b>${esc(q)}</b>` : `Ask ${P.assistant} a question about the documents`}</span><span class="kbd">${q ? "Enter" : ""}</span></button>
      ${q ? "" : suggestions.map((s) => `<button class="hit" data-suggest="${esc(s)}">${icon("search")}<span>${esc(s)}</span><span></span></button>`).join("")}</div>`;
  const found = group("In the documents", claimRows) + group("Open items", itemRows) + group("Documents", docRows);
  return `<div class="omni-pop" role="listbox">${askRow}${q && !found ? `<p class="meta" style="padding:8px 12px">Nothing in this hive matches “${esc(q)}”. Press Enter to ask ${P.assistant}.</p>` : found}</div>`;
}

function reply(q) {
  const t = q.toLowerCase();
  if (/eligible|qualify|should i|legal|advice|win/.test(t)) return { text: `That's a question for ${first(P.staff)}. I can only tell you what the documents say.`, handoff: true };
  if (/missing|still|need|request|2023/.test(t)) { const m = missing(); return m.length ? { text: `${m.length} records are still to come. The first: ${m[0].detail}`, ev: m[0].ev } : { text: "Nothing requested is still missing." }; }
  if (/transfer|left|money|7710|ellis/.test(t)) return { text: "Two transfers of $1,000.00 or more left the accounts with no matching deposit: $12,000.00 to account 7710 on March 14, 2024, and an $8,500.00 check to R. Ellis on August 2, 2025.", ev: ["e2", "e3"] };

  const tabs = [["home", "Home", ""], ["documents", "Documents", `<span class="c num">${S.docs.length}</span>`], ["report", "Report", ""], ["notes", "Team notes", `<svg class="icon lock" viewBox="0 0 24 24">${ICON.lock}</svg>`]];
  return `<div class="hivehead"><div class="hh-row"><div><h1>${esc(S.hiveTitle)}</h1><p class="sub">${esc(S.purpose)} · for ${esc(P.client)}</p></div>
    <div class="people"><div class="stack">${avatar("client")}${avatar("staff")}${avatar("ai")}</div><span>${esc(P.client)}, ${esc(P.staff)} and ${P.assistant}</span></div></div>
    <nav class="tabs" role="tablist">${tabs.map(([k, l, x]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k && !state.evidence}">${l}${x}</button>`).join("")}</nav></div>`;
}

/* ───── Staff home ───── */
function stateSentence() {
  const n = inCount(), of = totalAsked(), m = missing().length, d = toDecide().length;
  return `${n} of ${of} documents are in. ${d ? `${d} ${d === 1 ? "thing needs" : "things need"} a decision` : "Nothing needs a decision"}${m ? `, and ${m} ${m === 1 ? "record is" : "records are"} still to come.` : "."} <em>${esc(P.client)} last wrote today at 9:13 AM.</em>`;
}
function nextSteps() {
  const steps = [];
  const m = missing();
  if (m.length) steps.push({ dot: ["Still to come", "coral"], t: `Ask ${first(P.client)} for ${m.length} missing ${m.length === 1 ? "record" : "records"}`, d: m.slice(0, 2).map((x) => x.request || x.title).join(" · ") + (m.length > 2 ? ` · ${m.length - 2} more` : ""), a: `<button class="btn" data-act="request">Write the request</button>` });
  toDecide().forEach((x) => steps.push({ dot: [x.kind === "changed" ? "Changed" : "To decide", x.kind === "changed" ? "honey" : "blue"], t: x.title, d: x.detail, a: `<button class="btn" data-ev="${x.ev[0]}" data-item="${x.id}">Look at it</button>` }));
  return steps;
}
function home() {
  const n = inCount(), of = totalAsked();
  const allSteps = nextSteps();
  const steps = state.expanded.steps ? allSteps : allSteps.slice(0, 3);
  const groups = S.understand.groups;
  return `${hivehead()}<div class="home"><div class="brief">
      <p class="state">${stateSentence()}</p>
      ${meter(n, of)}<p class="meta">Study v${S.studyRev}, accepted ${esc(S.studyRevs.at(-1).date)} · every statement below opens the page it comes from</p>
      <section class="sec"><header><h2>Next steps</h2><span class="meta num">${allSteps.length}</span></header>
        ${steps.map((s) => `<div class="step"><div class="t"><span class="dot ${s.dot[1]}">${s.dot[0]}</span>${esc(s.t)}</div><p class="d">${esc(s.d)}</p><div class="a">${s.a}</div></div>`).join("") || `<p class="meta" style="padding:14px 0">Nothing is waiting on you.</p>`}
        ${allSteps.length > 3 ? `<button class="btn text more" data-expand="steps">${state.expanded.steps ? "Show fewer" : `Show all ${allSteps.length}`}</button>` : ""}
      </section>
      <section class="sec"><header><h2>What the documents show</h2><span class="meta num">${groups.reduce((n, g) => n + g.items.length, 0)} statements</span></header>
        ${groups.map((g, gi) => {
          const open = state.expanded["g" + gi]; const rows = open ? g.items : g.items.slice(0, 2);
          return `<div class="topic"><h3>${esc(g.title)}${g.unc ? `<span class="dot honey">Uncertain</span>` : ""}</h3>
            ${rows.map((it) => `<div class="claim" role="button" tabindex="0" ${it.ev[0] ? `data-ev="${it.ev[0]}"` : ""}>${esc(it.text)}${it.ev.length ? `<span class="go">See the page →</span>` : ""}${refs(it.ev)}</div>`).join("")}
            ${g.items.length > 2 ? `<button class="btn text more" data-expand="g${gi}">${open ? "Show fewer" : `${g.items.length - 2} more`}</button>` : ""}</div>`;
        }).join("")}
      </section>
    </div>${conversation()}</div>`;
}

function msgRow(m) {
  const mine = m.role === state.who;
  const name = m.role === "client" ? P.client : m.role === "staff" ? P.staff : P.assistant;
  const role = m.role === "client" ? "Client" : m.role === "staff" ? P.staffTitle : "";
  return `<article class="msg">${avatar(m.role)}<div><div class="by"><b>${esc(name)}</b>${mine ? "<span>you</span>" : ""}${role ? `<span>${esc(role)}</span>` : `<span class="tag">AI assistant</span>`}<span class="num">${esc(m.time)}</span></div>
    ${m.fromAsk ? `<p class="meta">Passed on from Ask ${P.assistant}</p>` : ""}<p class="text">${esc(m.text)}</p>${refs(m.ev)}</div></article>`;
}
function conversation() {
  const other = state.who === "client" ? first(P.staff) : first(P.client);
  return `<aside class="convo" aria-label="Conversation"><div class="convo-h"><div><h2>Conversation with ${other}</h2><p>People only. ${P.assistant} doesn't take part here.</p></div>${avatar(state.who === "client" ? "staff" : "client")}</div>
    <div class="thread" id="thread"><p class="day">Today</p>${state.messages.map(msgRow).join("")}</div>
    <div class="composer"><label class="sr" for="draft">Message</label><textarea id="draft" rows="2" placeholder="Write to ${other}…">${esc(state.draft)}</textarea>
      <div class="bar"><span class="hint">${icon("lock")}Everyone in this hive sees this</span><button class="btn primary" data-act="send">Send ${icon("send")}</button></div></div></aside>`;
}

/* ───── Evidence split ───── */
function evidence() {
  const id = state.evidence.ev, e = ev(id), d = doc(e.doc);
  const item = state.evidence.item ? S.exceptions.find((x) => x.id === state.evidence.item) : null;
  const ids = item ? item.ev : (S.understand.groups.flatMap((g) => g.items).find((it) => it.ev.includes(id))?.ev || [id]);
  const claim = item ? item.title : (S.understand.groups.flatMap((g) => g.items).find((it) => it.ev.includes(id))?.text || e.supports);
  const st = e.status === "verified" ? `<span class="dot leaf">Checked against the page</span>` : e.status === "unreadable" ? `<span class="dot coral">Page unreadable</span>` : `<span class="dot honey">Uncertain</span>`;
  const decided = item && state.decisions[item.id];
  const lines = (n) => Array.from({ length: n }, (_, i) => `<div class="ln" style="width:${[96, 88, 92, 74, 98, 83, 90, 66][(i + e.page) % 8]}%"></div>`).join("");
  return `${hivehead()}<div class="split">
    <section class="claimside" aria-label="The statement">
      <button class="btn quiet back" data-act="close">${icon("back")} Back to ${state.tab === "home" ? "Home" : "the list"}</button>
      <p class="big">${esc(claim)}</p>${st}
      ${item ? `<h4>Why it matters</h4><p>${esc(item.why)}</p>` : ""}
      <h4>What this page supports</h4><p>${esc(e.supports)}</p>
      ${e.unc ? `<h4>What the documents don't say</h4><p>${esc(e.unc)}</p>` : ""}
      ${ids.length > 1 ? `<h4>Pages behind this</h4><div class="others">${ids.map((x) => { const v = ev(x), dd = doc(v.doc); return `<button data-ev="${x}" ${state.evidence.item ? `data-item="${state.evidence.item}"` : ""} aria-current="${x === id}"><span>${esc(dd.role)}</span><span class="meta num">p.${v.page}</span></button>`; }).join("")}</div>` : ""}
      ${item && state.who === "staff" ? (decided ? `<p class="decided"><span class="dot leaf">${esc(decided)}</span> <button class="btn text" data-decide="">Undo</button></p>` :
        `<h4>Your decision</h4><div class="decide">${item.acts.includes("accept") ? `<button class="btn" data-decide="${esc(item.acceptLabel)}">${esc(item.acceptLabel)}</button><button class="btn" data-decide="${esc(item.rejectLabel)}">${esc(item.rejectLabel)}</button>` : `<button class="btn" data-decide="Reviewed">Mark reviewed</button>`}
        ${item.question || item.kind === "needs" ? `<button class="btn quiet" data-act="askclient" data-item="${item.id}">Ask ${first(P.client)} about it</button>` : ""}</div><p class="meta" style="margin-top:8px">A decision records your answer. It never changes the document.</p>`) : ""}
    </section>
    <section class="viewer" aria-label="Source page"><div class="vbar"><span><b>${esc(d.role)}</b> · ${esc(d.org)}</span><span class="num">Page ${e.page} of ${d.pages}</span></div>
      <div class="page" key="${id}"><div class="org"><span>${esc(d.org).toUpperCase()}</span><span>${esc(d.period)}</span></div>
        ${e.status === "unreadable" ? `<div class="unread">This page is too blurred to read.<br>Its transactions aren't part of any check.</div>` : `${lines(5)}<span class="hl">${esc(e.quote)}</span>${lines(9)}`}
      </div><p class="meta">Concept: the app shows the real page image here, with the cited line highlighted.</p></section>
  </div>`;
}

/* ───── Documents / Report / Notes ───── */
function documents() {
  const read = (d) => d.dup ? `<span class="dot honey">Duplicate</span>` : d.cov === 100 ? `<span class="dot leaf">Read</span>` : `<span class="dot coral">${d.cov}% read</span>`;
  const m = missing();
  return `${hivehead()}<div class="pagewrap"><section class="sec" style="margin-top:8px"><header><h2>Still to come</h2><span class="meta num">${m.length} records</span></header>
      ${m.map((x) => `<div class="step"><div class="t"><span class="dot coral">Missing</span>${esc(x.request)}</div><p class="d">${esc(x.detail)}</p><div class="a"><button class="btn" data-ev="${x.ev[0]}" data-item="${x.id}">Why</button></div></div>`).join("")}</section>
    <section class="sec"><header><h2>Uploaded</h2><span class="meta num">${S.docs.length} files · ${S.docs.reduce((n, d) => n + d.pages, 0)} pages</span></header>
    <table class="table"><thead><tr><th>Document</th><th>Period</th><th class="n">Pages</th><th>Read</th></tr></thead><tbody>
    ${S.docs.map((d) => { const e = Object.entries(S.ev).find(([, v]) => v.doc === d.id); return `<tr ${e ? `data-ev="${e[0]}"` : ""}><td><b>${esc(d.role)}</b><div class="s">${esc(d.type)}${d.flags.length ? " · " + esc(d.flags.map((f) => f.t).join("; ")) : ""}</div></td><td class="num hs">${esc(d.period)}</td><td class="n hs">${d.pages}</td><td>${read(d)}</td></tr>`; }).join("")}
    </tbody></table></section></div>`;
}
function report() {
  const ex = S.exceptions.filter((x) => !x.hidden);
  return `${hivehead()}<div class="pagewrap read"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px"><p class="meta">Written from Study v${S.studyRev}. Nothing new is analyzed.</p><button class="btn" data-act="print">${icon("print")} Save as PDF</button></div>
    <article class="paper"><p class="meta">HiveForYou · prepared for ${esc(P.client)} · Study v${S.studyRev}</p><h2>${esc(S.deliverable)}</h2><p style="color:var(--ink-2)">${esc(S.goal)}</p>
    <h3>What the documents show</h3>${S.understand.groups.filter((g) => !g.unc).map((g) => `<p><b>${esc(g.title)}.</b> ${g.items.map((i) => esc(i.text)).join(" ")}</p>`).join("")}
    <h3>What still needs an answer</h3>${ex.map((x) => `<p><b>${esc(x.title)}.</b> ${esc(x.detail)}</p>`).join("")}
    <p class="meta" style="margin-top:28px;padding-top:12px;border-top:1px solid var(--line)">Not legal, financial or medical advice. Every statement is cited to its page in the professional version.</p></article></div>`;
}
function notes() {
  return `${hivehead()}<div class="pagewrap read"><p class="meta" style="margin:20px 0 6px">Only people at the firm see these. Never shown to ${esc(P.client)}.</p>
    ${state.notes.map((n) => `<div class="note"><div class="by"><b>${esc(n.who)}</b><span>${esc(n.when)}</span></div><p class="text" style="margin-top:3px">${esc(n.text)}</p></div>`).join("")}
    <div class="composer" style="margin-top:18px"><textarea id="note" placeholder="Add a note for the team…">${esc(state.noteDraft)}</textarea><div class="bar"><span class="hint">${icon("lock")}Staff only</span><button class="btn primary" data-act="note">Add note</button></div></div></div>`;
}

/* ───── Client home (phone first) ───── */
function client() {
  const all = S.exceptions.filter((x) => x.kind === "missing" && !x.hidden);
  const left = missing();
  const n = inCount(), of = totalAsked();
  const open = state.expanded.cl;
  const rows = open ? all : all.slice(0, 3);
  return `<main class="cl">
    <div class="cl-who">${avatar("staff", "lg")}<div><p>Your file with</p><b>${esc(P.staff)}</b><p>${esc(P.staffTitle)}</p></div></div>
    <h1>${esc(S.hiveTitle)}</h1>
    <p class="lead">${left.length ? `${left.length} ${left.length === 1 ? "thing" : "things"} left to send. Everything else is in.` : "Everything we asked for is in. Priya will be in touch."}</p>
    ${meter(n, of)}<p class="meta num">${n} of ${of} documents in</p>
    <section class="cl-sec"><h2>Still to send <span class="num">${left.length}</span></h2>
      ${rows.map((x) => state.sent[x.id] ? `<div class="ask-row done"><div><p>${esc(x.request)}</p><small><span class="dot leaf">Sent</span> · not read yet</small></div><span></span></div>` :
        `<div class="ask-row"><div><p>${esc(x.request)}</p><small>${esc(x.why)}</small></div><button class="btn" data-add="${x.id}">${icon("upload")} Add</button></div>`).join("")}
      ${all.length > 3 ? `<button class="btn text more" data-expand="cl">${open ? "Show fewer" : `${all.length - 3} more`}</button>` : ""}
    </section>
    <button class="cl-ask" data-act="focusomni">${avatar("ai")}<span>Ask ${P.assistant} about your documents</span></button>
    <section class="cl-sec"><h2>Messages with ${first(P.staff)}</h2>
      <div class="thread" id="thread">${state.messages.map(msgRow).join("")}</div>
      <div class="composer" style="margin-top:10px"><label class="sr" for="draft">Message</label><textarea id="draft" rows="2" placeholder="Write to ${first(P.staff)}…">${esc(state.draft)}</textarea>
        <div class="bar"><span class="hint">${icon("lock")}Only you and ${first(P.staff)}'s team</span><button class="btn primary" data-act="send">Send ${icon("send")}</button></div></div>
    </section>
    <p class="privacy">${icon("lock")}<span>Only you and ${first(P.staff)}'s team can see this file. ${P.assistant} is an AI assistant that answers only from your documents and never decides anything about your case.</span></p>
  </main>`;
}

/* ───── Render + events ───── */
function render() {
  let body;
  if (state.who === "client") body = state.evidence ? evidence() : client();
  else body = state.evidence ? evidence() : ({ home, documents, report, notes }[state.tab] || home)();
  if (state.who === "client" && state.evidence) body = body.replace(hivehead(), "");
  const focus = document.activeElement?.id; const pos = document.activeElement?.selectionStart;
  $("#app").innerHTML = topbar() + body + (state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : "");
  if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); if (pos != null && el.setSelectionRange) el.setSelectionRange(pos, pos); } }
  const t = $("#thread"); if (t && state.scrollThread) { t.lastElementChild?.scrollIntoView({ block: "nearest" }); state.scrollThread = false; }
}
function toast(m) { state.toast = m; render(); setTimeout(() => { state.toast = ""; $(".toast")?.remove(); }, 2600); }
function openEvidence(evId, item) { state.evidence = { ev: evId, item: item || null }; state.omniOpen = false; state.answer = null; render(); scrollTo(0, 0); }
function ask(q) {
  if (!q.trim()) return;
  state.answer = { q, pending: true }; state.omniOpen = true; render();
  setTimeout(() => { state.answer = { q, ...reply(q), pending: false }; render(); }, 1100);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, tr[data-ev], .claim[data-ev]");
  if (!t) { if (!e.target.closest(".omni") && state.omniOpen) { state.omniOpen = false; state.answer = null; render(); } return; }
  const d = t.dataset;
  if (d.who) { state.who = d.who; state.evidence = null; state.tab = "home"; state.omniOpen = false; state.answer = null; state.omni = ""; return render(); }
  if (d.tab) { state.tab = d.tab; state.evidence = null; return render(); }
  if (d.ev) return openEvidence(d.ev, d.item);
  if (d.expand) { state.expanded[d.expand] = !state.expanded[d.expand]; return render(); }
  if (d.suggest) { state.omni = d.suggest; return ask(d.suggest); }
  if (d.add) { state.sent[d.add] = true; return toast("Added. Priya's team will see it in Documents."); }
  if (d.decide != null) { const it = state.evidence.item; if (d.decide) state.decisions[it] = d.decide; else delete state.decisions[it]; return toast(d.decide ? "Decision recorded. The document is unchanged." : "Decision undone."); }
  switch (d.act) {
    case "ask": return ask(state.omni);
    case "newq": state.answer = null; state.omni = ""; render(); return $("#omni")?.focus();
    case "close": state.evidence = null; return render();
    case "focusomni": state.omniOpen = true; render(); return $("#omni")?.focus();
    case "handoff": state.messages.push({ role: "client", text: state.answer.q, time: "Just now", fromAsk: true }); state.answer = null; state.omniOpen = false; state.omni = ""; state.scrollThread = true; return toast(`Sent to ${first(P.staff)} in your messages.`);
    case "request": { const m = missing(); state.draft = `Could you send these when you have a moment?\n` + m.map((x) => "• " + x.request).join("\n"); render(); return $("#draft")?.focus(); }
    case "askclient": { const it = S.exceptions.find((x) => x.id === d.item); state.evidence = null; state.draft = it.question || `Could you tell me more about this: ${it.title}?`; render(); return $("#draft")?.focus(); }
    case "send": { const v = $("#draft")?.value.trim(); if (!v) return $("#draft")?.focus(); state.messages.push({ role: state.who, text: v, time: "Just now" }); state.draft = ""; state.scrollThread = true; return render(); }
    case "note": { const v = $("#note")?.value.trim(); if (!v) return; state.notes.push({ who: "Priya Shah", when: "Just now", text: v }); state.noteDraft = ""; return render(); }
    case "print": return print();
  }
});
document.addEventListener("focusin", (e) => { if (e.target.id === "omni" && !state.omniOpen) { state.omniOpen = true; render(); } });
document.addEventListener("input", (e) => {
  if (e.target.id === "omni") { state.omni = e.target.value; state.answer = null; state.omniOpen = true; render(); }
  if (e.target.id === "draft") state.draft = e.target.value;
  if (e.target.id === "note") state.noteDraft = e.target.value;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") { e.preventDefault(); $("#omni")?.focus(); }
  if (e.key === "Escape") { if (state.omniOpen) { state.omniOpen = false; state.answer = null; render(); $("#omni")?.blur(); } else if (state.evidence) { state.evidence = null; render(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("claim") && e.target.dataset.ev) { e.preventDefault(); openEvidence(e.target.dataset.ev); }
  if (e.key === "Enter" && e.target.id === "omni") { e.preventDefault(); ask(state.omni); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "draft") { e.preventDefault(); $('[data-act="send"]')?.click(); }
});
render();
</script></body></html>
