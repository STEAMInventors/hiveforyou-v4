<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HiveForYou — prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
/* HiveForYou design system — prototype v2 ("calm document desk"). Tokens mirror docs/DESIGN.md. */
:root {
  --ink: #1b1f24;
  --ink-2: #454d57;
  --ink-3: #6b737d;
  --line: #e7e9ec;
  --line-strong: #d6dade;
  --paper: #ffffff;
  --canvas: #f7f8fa;
  --hover: #f3f4f6;

  --blue: #3b7cf6;
  --blue-deep: #1a56c4;
  --blue-wash: #eef3fe;
  --coral: #ef5143;
  --coral-deep: #b3392d;
  --coral-wash: #fdf0ee;
  --honey: #f6b826;
  --honey-deep: #7a5200;
  --honey-wash: #fef6e0;
  --leaf: #2fa35a;
  --leaf-deep: #1d7a42;
  --leaf-wash: #eaf5ee;

  --font-display: "Outfit", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --font-page: "Source Serif 4", Georgia, serif;

  --r-control: 8px;
  --r-surface: 12px;
  --shadow-pop: 0 12px 32px -8px rgba(20, 30, 50, 0.18), 0 2px 6px rgba(20, 30, 50, 0.06);

  --col-read: 760px;
  --col-wide: 1040px;
  --top-h: 60px;
  --rail-w: 240px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.6 var(--font-body);
  font-feature-settings: "tnum" 0;
  -webkit-font-smoothing: antialiased;
}
::selection { background: #cfe0fd; color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
a { color: var(--blue-deep); text-underline-offset: 3px; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 600; color: var(--ink); text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Type scale: title 30 · section 19 · item 15/600 · body 15 · meta 13 · label 12.5 */
.t-title { font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; }
.t-section { font-size: 19px; line-height: 1.3; letter-spacing: -0.01em; }
.t-item { font: 600 15px/1.45 var(--font-body); }
.t-meta { font-size: 13px; line-height: 1.5; color: var(--ink-3); }
.t-lead { font-size: 15px; color: var(--ink-2); }
.muted { color: var(--ink-3); }

/* Buttons: one primary per screen; secondary bordered; text = link-style */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: var(--r-control);
  border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink);
  font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.primary:hover { background: #1647a3; }
.btn.text { border-color: transparent; background: transparent; color: var(--blue-deep); padding: 0 6px; height: 32px; }
.btn.text:hover { background: var(--blue-wash); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--hover); color: var(--ink); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn .icon { width: 16px; height: 16px; }

/* Status = dot + word (never a filled pill) */
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.blue { color: var(--blue-deep); }
.status.coral { color: var(--coral-deep); }
.status.honey { color: var(--honey-deep); }
.status.honey::before { background: var(--honey); }
.status.leaf { color: var(--leaf-deep); }
.status.grey { color: var(--ink-3); }

/* Source reference: the signature element, quiet until touched */
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ref {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
  height: 24px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--paper); color: var(--ink-2); font-size: 12.5px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
}
.ref svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; flex: none; opacity: 0.7; }
.ref:hover { background: var(--blue-wash); border-color: #c9d9fb; color: var(--blue-deep); }
.ref .pg { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ref:hover .pg { color: var(--blue-deep); }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--top-h);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 24px; background: rgba(255,255,255,0.92); backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 9px; border: 0; background: none; padding: 0; font-family: var(--font-display); font-size: 20px; letter-spacing: -0.035em; color: var(--ink); }
.brand strong { font-weight: 600; }
.brand span { font-weight: 400; }
.mark { width: 24px; height: 30px; flex: none; }
.mark polygon { stroke: #fff; stroke-width: 2.5; stroke-linejoin: round; }
.topnav { display: flex; align-items: center; gap: 4px; }
.topnav .btn.quiet { height: 34px; }
.demo-tag { margin-left: 8px; font-size: 12px; font-weight: 500; color: var(--honey-deep); background: var(--honey-wash); border-radius: 6px; padding: 3px 8px; }
.avatar-me { width: 30px; height: 30px; border-radius: 50%; background: var(--blue-wash); color: var(--blue-deep); display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-left: 8px; }

/* Hive shell */
.shell { background: linear-gradient(to right, var(--canvas) calc(var(--rail-w) - 1px), var(--line) calc(var(--rail-w) - 1px), var(--line) var(--rail-w), var(--paper) var(--rail-w)); display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.rail { position: sticky; top: var(--top-h); align-self: start; height: calc(100vh - var(--top-h)); overflow-y: auto; border-right: 1px solid var(--line); background: var(--canvas); padding: 20px 12px; display: flex; flex-direction: column; }
.hivecard { display: flex; gap: 10px; padding: 4px 8px 18px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.hive-initials { width: 34px; height: 34px; border-radius: 9px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; font: 600 13px var(--font-display); color: var(--ink-2); flex: none; }
.hivecard .name { font: 600 14px/1.3 var(--font-body); }
.hivecard .purpose { font-size: 12.5px; line-height: 1.4; color: var(--ink-3); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.railnav { display: flex; flex-direction: column; gap: 2px; }
.railnav button {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px;
  border: 0; border-radius: var(--r-control); background: transparent; color: var(--ink-2);
  font-size: 14px; font-weight: 500; text-align: left;
}
.railnav button:hover { background: var(--hover); color: var(--ink); }
.railnav button[aria-current="page"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(20,30,50,0.04); }
.railnav button[aria-current="page"] .icon { color: var(--blue-deep); }
.railnav .count { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.railnav .count.alert { color: var(--coral-deep); }
.railnav .staff { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
.railfoot { margin-top: auto; padding: 16px 10px 4px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.railfoot strong { color: var(--ink-2); font-weight: 600; }

.main { min-width: 0; padding: 28px 40px 96px; }
.col { max-width: var(--col-read); margin: 0 auto; }
.col.wide { max-width: var(--col-wide); }
.crumb { font-size: 13px; color: var(--ink-3); margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumb button { border: 0; background: none; padding: 0; color: var(--ink-3); }
.crumb button:hover { color: var(--blue-deep); text-decoration: underline; text-underline-offset: 3px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 20px; margin-bottom: 8px; }
.pagehead p { margin-top: 6px; color: var(--ink-2); }
.pagehead .actions { display: flex; gap: 8px; flex: none; }

/* Sections: space and a rule, not boxes */
.section { padding-top: 36px; }
.section > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
.section > header .t-meta { white-space: nowrap; }
.rows > * { border-bottom: 1px solid var(--line); }
.row { padding: 16px 0; }
.row p { color: var(--ink); }

.metaline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--ink-3); }
.metaline > * + *::before { content: ""; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); margin-right: 14px; vertical-align: middle; }

/* At a glance: a definition row, not hero tiles */
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 24px; }
.glance > div { padding: 14px 16px 14px 0; }
.glance > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.glance dt { font-size: 12.5px; color: var(--ink-3); }
.glance dd { margin: 2px 0 0; font: 600 20px/1.3 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.glance .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

/* Open items list */
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 0; }
.item .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.item .detail { grid-column: 1; color: var(--ink-2); font-size: 14px; }
.item .side { grid-row: 1 / span 3; grid-column: 2; align-self: start; }
.item .refs { grid-column: 1; }

/* Statements */
.topic { padding-top: 28px; }
.topic h3 { font: 600 15px/1.4 var(--font-body); display: flex; align-items: center; gap: 12px; }
.statement { padding: 12px 0; border-bottom: 1px solid var(--line); }
.statement:last-child { border-bottom: 0; }
.statement p { font-size: 15px; }

/* Long pages: counts, "show all", filter, on-this-page */
.count-h { font: 500 13px var(--font-body); color: var(--ink-3); margin-left: 6px; }
.more-btn { margin: 8px 0 0 -6px; }
.findbar { display: flex; gap: 8px; margin-top: 28px; }
.filterbox { flex: 1; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--paper); color: var(--ink-3); }
.filterbox:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,124,246,0.15); }
.filterbox input { flex: 1; height: 100%; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--ink); }
.filterbox .icon { width: 15px; height: 15px; }
.jump select { height: 38px; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--paper); padding: 0 10px; font-size: 14px; }
.withtoc { display: grid; grid-template-columns: minmax(0, 1fr); }
.withtoc > .col { min-width: 0; width: 100%; }
.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: none; }
.toc { display: none; }
@media (min-width: 1280px) {
  .withtoc { grid-template-columns: minmax(0, 1fr) 200px; gap: 40px; max-width: calc(var(--col-read) + 240px); margin: 0 auto; }
  .withtoc > .col { margin: 0; }
  .toc { display: block; position: sticky; top: calc(var(--top-h) + 28px); align-self: start; padding-top: 150px; font-size: 13px; }
  .toc-title { font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  .toc a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0 5px 10px; border-left: 2px solid var(--line); color: var(--ink-3); text-decoration: none; line-height: 1.35; }
  .toc a:hover { color: var(--ink); }
  .toc a[aria-current] { border-left-color: var(--blue-deep); color: var(--ink); font-weight: 600; }
  .jump { display: none; }
}

/* Two-column rows (date or label, then content) */
.trow { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; }
.trow > * { min-width: 0; }

/* Disclosures */
details.more { border-bottom: 1px solid var(--line); }
details.more > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 2px; cursor: pointer; font-weight: 600; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .icon { transition: transform 160ms ease; color: var(--ink-3); }
details.more[open] > summary .icon { transform: rotate(90deg); }
details.more > summary .t-meta { font-weight: 400; margin-left: auto; }
details.more .body { padding: 4px 0 24px; }

/* Tables */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--ink-3); padding: 10px 12px 10px 0; border-bottom: 1px solid var(--ink); white-space: nowrap; }
.table td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 1px solid var(--line); }
.table td.n, .table th.n { text-align: right; font-variant-numeric: tabular-nums; }
.table .cell-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.table tbody tr:hover td { background: #fafbfc; }
.scrollx { overflow-x: auto; }

/* Segmented control */
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--hover); gap: 2px; }
.seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(20,30,50,0.08), 0 0 0 1px var(--line); }

/* Conversation */
.still { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.still .bar { flex: 1; max-width: 160px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.still .bar span { display: block; height: 100%; background: var(--leaf); }
.thread { padding: 8px 0 24px; }
.dateline { display: flex; align-items: center; gap: 12px; margin: 20px 0 8px; font-size: 12.5px; color: var(--ink-3); }
.dateline::before, .dateline::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.msg { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 12px 0; }
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.av.client { background: var(--leaf-wash); color: var(--leaf-deep); }
.av.staff { background: var(--blue-wash); color: var(--blue-deep); }
.av.assistant { background: var(--ink); color: #fff; }
.av.assistant .mark { width: 15px; height: 19px; }
.av.assistant .mark polygon { stroke: var(--ink); }
.byline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; font-size: 13px; color: var(--ink-3); }
.byline strong { font-size: 14px; color: var(--ink); font-weight: 600; }
.ai-tag { font-size: 11.5px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 6px; line-height: 18px; }
.msg .text { margin-top: 2px; font-size: 15px; white-space: pre-wrap; }
.msg.mine .text { color: var(--ink); }
.msg.mine .byline strong::after { content: " · you"; font-weight: 400; color: var(--ink-3); }
.typing { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); padding: 4px 0 0 44px; }
.composer { position: sticky; bottom: 16px; margin-top: 8px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r-surface); box-shadow: 0 8px 24px -12px rgba(20,30,50,0.18); }
.composer:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,124,246,0.15); }
.composer textarea { display: block; width: 100%; min-height: 64px; max-height: 180px; resize: none; border: 0; outline: 0; padding: 14px 16px 6px; background: transparent; font-size: 15px; line-height: 1.5; }
.composer .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px 10px 16px; }
.composer .hint { font-size: 12.5px; color: var(--ink-3); }
.previewas { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
.previewas select { height: 30px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--paper); padding: 0 8px; font-size: 13px; color: var(--ink); }

/* Report paper */
.paper-doc { margin-top: 24px; border: 1px solid var(--line); border-radius: 4px; padding: 48px 56px; box-shadow: 0 1px 2px rgba(20,30,50,0.04), 0 12px 32px -20px rgba(20,30,50,0.2); }
.paper-doc h2 { font-size: 26px; letter-spacing: -0.02em; margin: 8px 0 12px; }
.paper-doc h3 { font-size: 16px; margin: 28px 0 8px; }
.paper-doc p { margin: 8px 0; }

/* Drawer */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(20, 26, 34, 0.28); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 51; width: min(520px, 100vw); background: var(--paper); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; animation: slidein 220ms cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slidein { from { transform: translateX(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.drawer:focus { outline: 0; }
.drawer header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.drawer .content { padding: 20px 24px 32px; overflow-y: auto; }
.drawer h4 { font: 600 13px var(--font-body); color: var(--ink-3); margin: 24px 0 6px; }
.excerpt { margin: 16px 0; padding: 22px 24px; border: 1px solid var(--line); border-radius: 4px; background: #fffefb; font-family: var(--font-page); font-size: 16px; line-height: 1.6; color: #2a2a2a; box-shadow: 0 1px 0 var(--line), 0 6px 18px -14px rgba(0,0,0,0.25); }
.excerpt mark { background: #fff1bf; padding: 1px 2px; border-radius: 2px; }
.excerpt .src { font-family: var(--font-body); font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
.field { display: block; margin-top: 16px; }
.field span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-control); padding: 10px 12px; background: var(--paper); }
.field textarea { min-height: 90px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,124,246,0.15); }
.dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; font-size: 14px; margin-top: 16px; }
.dl dt { color: var(--ink-3); }
.dl dd { margin: 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow-pop); }

/* Landing */
.hero { max-width: 760px; margin: 0 auto; padding: 120px 24px 56px; text-align: center; }
.hero h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.04; letter-spacing: -0.04em; }
.hero .lead { margin: 18px auto 36px; max-width: 540px; font-size: 18px; color: var(--ink-2); }
.ring { padding: 2px; border-radius: 16px; background: linear-gradient(100deg, var(--blue) 0 25%, var(--coral) 25% 50%, var(--honey) 50% 75%, var(--leaf) 75%); box-shadow: 0 10px 30px -14px rgba(26, 86, 196, 0.35); }
.ring-inner { display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 14px; padding: 8px 8px 8px 20px; }
.ring-inner input { flex: 1; min-width: 0; height: 48px; border: 0; outline: 0; font-size: 17px; background: transparent; }

  for (const s of all) for (const g of s.understand.groups) {
    const same = groups.find((x) => x.title === g.title);
    same ? same.items.push(...g.items) : groups.push({ ...g, items: [...g.items] });
  }
  DATA.S.large = {
    ...base, id: "large", hiveTitle: "Large sample hive", purpose: "All three samples in one hive, to test long pages",
    docs: all.flatMap((s) => s.docs), ev: Object.assign({}, ...all.map((s) => s.ev)),
    exceptions: all.flatMap((s) => s.exceptions), understand: { metrics: base.understand.metrics, groups },
    timeline: all.flatMap((s) => s.timeline), ops: all.flatMap((s, i) => s.ops.map((o) => (i ? { ...o, calc: undefined } : o))),
  };
  PEOPLE.large = PEOPLE.medicaid; TEAM_NOTES.large = TEAM_NOTES.medicaid;
})();

const doc = (id) => S().docs.find((d) => d.id === id);

const initials = (name) => name.split(/\s+/).filter((w) => /^[A-Za-z]/.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join("");

const btn = (label, action, cls = "") => `<button class="btn ${cls}" data-action="${action}">${label}</button>`;

const status = (word, tone) => `<span class="status ${tone}">${esc(word)}</span>`;

// Source reference: "<document role> · p.<n>" — never a file name.
const ref = (id) => {
  const e = ev(id);
  if (!e) return "";
  const d = doc(e.doc);
  return `<button class="ref" data-evidence="${id}" title="Open ${esc(d?.role || "source")}, page ${e.page}">${icon("doc", "")}${esc(d?.role || "Source")} <span class="pg">p.${e.page}</span></button>`;
};
const refs = (ids) => (ids && ids.length ? `<div class="refs">${ids.map(ref).join("")}</div>` : "");

function calcValue(id) {
  const c = S().calcs?.[id];
  if (!c) return "—";
  const total = c.inputs.filter((i) => !i.when || state.decisions[i.when.x] === i.when.status).reduce((n, i) => n + i.value * i.sign, 0);
  return c.unit === "usd"
    ? new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(total)
    : `${total} ${c.unit === "min" ? "minutes" : c.unit}`;
}

/* ───────────── Long lists (generic) ─────────────
   Any list longer than its limit shows the first n and a "Show all" control with the total.
   Limits: 5 rows for item lists, 3 statements per topic. A filter or search shows everything. */
const LIMIT = { items: 5, statements: 3, rows: 6 };
function limited(listId, arr, n) {
  const open = state.expanded[listId] || state.find.trim();
  return { shown: open ? arr : arr.slice(0, n), hidden: open ? 0 : Math.max(0, arr.length - n), total: arr.length };
}
function moreControl(listId, hidden, total, label) {
  if (state.find.trim() || total <= 0) return "";
  if (hidden > 0) return `<button class="btn text sm more-btn" data-expand="${listId}">${label ? esc(label) : `Show all ${total}`}</button>`;
  if (state.expanded[listId]) return `<button class="btn text sm more-btn" data-expand="${listId}">Show fewer</button>`;
  return "";
}
const matches = (...texts) => {
  const q = state.find.trim().toLowerCase();
  return !q || texts.some((x) => String(x || "").toLowerCase().includes(q));
};

function assistantReply(q) {
  const t = q.toLowerCase();
  const items = openItems();
  const match = items.find((x) => x.title.toLowerCase().split(" ").some((w) => w.length > 5 && t.includes(w)));
  if (/missing|gap|statement|need|request|document/.test(t)) {
    const x = match || items.find((i) => i.kind === "missing");
    return x ? { text: `${x.detail} You can add it under Documents → What we asked for.`, ev: x.ev } : { text: "Nothing requested is still missing." };
  }
  if (/transfer|compare|change|different|speech|estimate/.test(t)) {
    const x = match || items.find((i) => i.kind === "changed") || items[0];
    return x ? { text: x.detail, ev: x.ev } : { text: "I couldn't find a difference about that in the documents." };
  }
  if (/eligible|qualify|should i|legal|advice|win/.test(t)) {
    return { text: `That's a question for ${P().staff.split(" ")[0]}. I've passed it on. I can only tell you what the documents say.` };
  }
  return { text: `I couldn't find that in the documents yet. I've asked ${P().staff.split(" ")[0]} to take a look.` };
}

function findings() {

  const list = limited("review", items, LIMIT.items);
  const topics = s.understand.groups
    .map((g, i) => ({ ...g, id: `topic-${i}`, rows: g.items.filter((it) => matches(g.title, it.text, ...(it.ev || []).map((id) => doc(ev(id)?.doc)?.role))) }))
    .filter((g) => g.rows.length);
  const statementCount = topics.reduce((n, g) => n + g.rows.length, 0);
  const finding = state.find.trim();

  return `<div class="withtoc">

    <div class="findbar">
      <label class="filterbox"><span class="sr-only">Filter findings</span>${icon("filter")}<input id="find" type="search" placeholder="Filter by a word, name or amount" value="${esc(state.find)}" autocomplete="off"></label>
      <label class="jump"><span class="sr-only">Jump to</span><select id="jump"><option value="">Jump to…</option>${toc.map(([id, l, n]) => `<option value="${id}">${esc(l)}${n !== "" ? ` (${n})` : ""}</option>`).join("")}</select></label>
    </div>
    ${finding ? `<p class="t-meta" role="status" style="margin-top:10px">${items.length} ${items.length === 1 ? "item" : "items"} and ${statementCount} ${statementCount === 1 ? "statement" : "statements"} match “${esc(finding)}”. <button class="btn text sm" data-action="clearfind">Clear</button></p>` : ""}

      </header>
      <div class="rows">${list.shown.map((x) => {
        const k = KIND[x.kind] || KIND.needs;
        return `<div class="item"><div class="top">${status(k.word, k.tone)}<span class="t-item">${esc(x.title)}</span></div>
          <p class="detail">${esc(x.detail)}</p>${refs(x.ev)}

function compareTable() {

/* ───────────── Documents ───────────── */

function documents() {
  const s = S();
  const pages = s.docs.reduce((n, d) => n + d.pages, 0);
  const unreadable = s.docs.filter((d) => d.cov != null && d.cov < 100).length;
  const dups = s.docs.filter((d) => d.dup).length;
  const list = s.docs.filter((d) => state.filter === "all" || (state.filter === "attention" && (d.flags.length || d.cov !== 100)) || (state.filter === "ready" && d.cov === 100 && !d.flags.length));
  const missing = s.exceptions.filter((x) => x.kind === "missing" && !x.hidden);
  const readState = (d) =>
    d.dup ? status("Duplicate", "honey") : d.cov === 100 ? status("Read", "leaf") : d.cov == null ? status("Not read yet", "grey") : status(`${d.cov}% read`, "coral");
  return `<div class="col wide">
    ${pagehead("Documents", "Everything uploaded to this hive, what each file is, and how much of it was read.", btn(`${icon("upload")} Add documents`, "upload", "primary"))}
    <div class="metaline"><span class="num">${s.docs.length} files</span><span class="num">${pages} pages</span>${unreadable ? `<span>${unreadable} with unreadable pages</span>` : ""}${dups ? `<span>${dups} duplicate set aside</span>` : ""}</div>

      <div class="scrollx"><table class="table stack-sm"><thead><tr><th>Document</th><th>Period</th><th class="n">Pages</th><th>Read</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
      ${list.map((d) => `<tr><td><strong>${esc(d.role)}</strong><div class="cell-sub">${esc(d.type)} · ${esc(d.file)}</div><div class="cell-sub show-sm num">${esc(d.period)} · ${d.pages} pages</div></td><td class="num hide-sm">${esc(d.period)}</td><td class="n hide-sm">${d.pages}</td><td>${readState(d)}${d.flags.length ? `<div class="cell-sub">${esc(d.flags.map((f) => f.t).join("; "))}</div>` : ""}</td><td style="text-align:right">${btn("Inspect", "doc:" + d.id, "sm quiet")}</td></tr>`).join("")}
      ${state.fakeUploads.map((f) => `<tr><td><strong>${esc(f.name)}</strong><div class="cell-sub">Added in this demo · not read</div></td><td>—</td><td class="n">—</td><td>${status("Not read yet", "grey")}</td><td></td></tr>`).join("")}
      </tbody></table></div>
      <p class="t-meta" style="margin-top:12px">Reading a page isn't the same as proving what it says. Unreadable pages and gaps stay visible.</p>
    </section>

    <section class="section" id="requested" aria-labelledby="h-asked">
      <header><h2 class="t-section" id="h-asked">What we asked for</h2><span class="t-meta num">${missing.length} still to come</span></header>
      <div class="rows">${limited("asked", missing, LIMIT.items).shown.map((x) => `<div class="item"><div class="top">${status("Missing", "coral")}<span class="t-item">${esc(x.request || x.title)}</span></div><p class="detail">${esc(x.detail)}</p><div class="side">${btn("Add it", "upload", "sm")}</div></div>`).join("")}</div>
      ${(() => { const l = limited("asked", missing, LIMIT.items); return moreControl("asked", l.hidden, l.total); })()}
    </section>
  </div>`;
}

/* ───────────── Reports ───────────── */

function reports() {
  const s = S();
  const hist = state.reportHistory[state.scenario] || [];
  return `<div class="col">
    ${pagehead("Reports", "One Study, written for two readers. Both use the same facts and sources.", state.reportMade ? btn(`${icon("download")} Print or save as PDF`, "print", "") : "")}
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
      <div class="seg" role="group" aria-label="Audience">${[["customer", "For the client · plain language"], ["pro", "For the professional · evidence detail"]].map(([k, l]) => `<button data-audience="${k}" aria-pressed="${state.reportAudience === k}">${l}</button>`).join("")}</div>
      ${btn("Generate report", "generate", "primary")}
    </div>
    ${hist.length ? `<div class="t-meta" style="margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px">Saved reports:${hist.map((r, i) => `<button class="btn text sm" data-history="${i}">${r.audience === "pro" ? "Professional" : "Client"} report · ${esc(r.at)}</button>`).join("")}</div>` : ""}
    ${state.reportMade ? reportPaper() : `<p class="t-meta" style="margin-top:16px">Choose a reader and generate. The report is built from Study v${s.studyRev}; nothing new is analyzed.</p>`}
  </div>`;
}
function reportPaper() {
  const s = S();
  const pro = state.reportAudience === "pro";
  const ex = s.exceptions.filter((x) => !x.hidden);
  return `<article class="paper-doc" id="print-report">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="brand" style="font-size:16px">${MARK}<span><strong>Hive</strong><span>ForYou</span></span></span><span class="t-meta">${pro ? "Professional review" : "Client summary"} · Study v${s.studyRev}</span></div>
    <h2>${esc(s.deliverable)}</h2><p class="t-lead">${esc(s.goal)}</p>
    <h3>What the documents show</h3>
    ${s.understand.groups.filter((g) => !g.unc).slice(0, pro ? 4 : 2).map((g) => `<p><strong>${esc(g.title)}.</strong> ${g.items.slice(0, pro ? 6 : 2).map((it) => esc(it.text)).join(" ")}</p>`).join("")}
    <h3>What still needs an answer</h3>
    ${ex.slice(0, pro ? 10 : 4).map((x) => `<p><strong>${esc(x.title)}.</strong> ${esc(x.detail)}</p>${pro ? refs(x.ev) : ""}`).join("")}
    ${pro ? `<h3>Sources and scope</h3><table class="table"><thead><tr><th>Source</th><th>Period</th><th class="n">Read</th></tr></thead><tbody>${s.docs.map((d) => `<tr><td>${esc(d.role)}</td><td>${esc(d.period)}</td><td class="n">${d.dup ? "Duplicate" : d.cov == null ? "—" : d.cov + "%"}</td></tr>`).join("")}</tbody></table>
    <h3>Limits</h3><p>Statements are cited as what the documents say. Unreadable pages, uncertain matches and missing uploads limit what can be concluded. This report makes no eligibility, legal or coverage determination.</p>` : ""}
    <p class="t-meta" style="margin-top:32px;padding-top:12px;border-top:1px solid var(--line)">Prepared with HiveForYou · not legal, financial, educational or medical advice.</p>
  </article>`;
}

/* ───────────── Audit trail ───────────── */

function audit() {
  const s = S();
  return `<div class="col">
    ${pagehead("Audit trail", "How HiveForYou reached its findings: each check, its method and its result.")}
    <section class="section" aria-labelledby="h-checks" style="padding-top:8px">
      <header><h2 class="t-section" id="h-checks">Checks</h2><span class="t-meta num">${s.ops.length} checks</span></header>
      <div class="rows">${limited("checks", s.ops, LIMIT.rows).shown.map((o) => `<div class="row"><div class="t-item">${esc(o.title)}</div>
        <dl class="dl" style="margin-top:8px"><dt>Method</dt><dd>${esc(o.method)}</dd><dt>Result</dt><dd>${esc(o.output)}</dd></dl>${refs(o.ev)}
        ${o.calc ? `<button class="btn text sm" style="margin-left:-6px;margin-top:6px" data-action="calc:${o.calc}">How it's calculated</button>` : ""}</div>`).join("")}</div>
      ${(() => { const l = limited("checks", s.ops, LIMIT.rows); return moreControl("checks", l.hidden, l.total); })()}

    <section class="section" aria-labelledby="h-revs">

    </section>
  </div>`;
}

/* ───────────── Team notes (staff only) ───────────── */

function notes() {
  const list = (state.teamNotes[state.scenario] ??= TEAM_NOTES[state.scenario].map((n) => ({ ...n })));
  return `<div class="col">
    ${pagehead("Team notes", `Only people at your firm see these. Never shown to ${esc(P().client)}.`)}
    <div class="rows">${list.map((n) => `<div class="note"><div class="byline"><strong>${esc(n.who)}</strong><span class="num">${esc(n.when)}</span></div><p class="text" style="margin-top:2px">${esc(n.text)}</p></div>`).join("")}</div>
    <div class="composer" style="position:static;margin-top:20px"><label for="note" class="sr-only">Team note</label><textarea id="note" placeholder="Add a note for the team…">${esc(state.noteDraft)}</textarea><div class="bar"><span class="hint">${icon("lock", "icon")} Staff only</span>${btn("Add note", "addnote", "primary")}</div></div>
  </div>`;
}

/* ───────────── Front page and hive list ───────────── */

function landing() {
  return `${topbar()}<main>
    <section class="hero">
      <h1>What are you working on?</h1>
      <p class="lead">Bring the documents. Say what you need to understand. See the whole picture, with every finding tied to its page.</p>
      <form id="intent-form" class="ring"><div class="ring-inner"><label for="intent" class="sr-only">What are you working on?</label><input id="intent" placeholder="e.g. Mom's Medicaid application" value="${esc(state.intent)}" autocomplete="off"><button class="btn primary" type="submit" aria-label="Continue">${icon("arrow")}</button></div></form>
      <div class="suggest"><span>Try:</span><button data-scenario="iep">Preparing for an IEP meeting</button><button data-scenario="medicaid">Medicaid paperwork</button><button data-scenario="insurance">An insurance claim</button></div>
      <div class="alt">${btn(`${icon("upload")} Add documents`, "new", "")}${btn("See a sample hive", "library", "quiet")}</div>
    </section>
    <section class="how" id="how-it-works">
      <h2>From a pile of paper to clear next steps</h2>
      <div class="steps">
        <div><h3>Collect</h3><p>Upload whatever you have, old, partial or out of order. HiveForYou reads every page and tells you what's missing.</p></div>
        <div><h3>Understand</h3><p>See what the documents establish, where they disagree, and what happened when. Every statement opens its page.</p></div>
        <div><h3>Share</h3><p>Get a plain-language summary, or an evidence-detailed report for a professional, from the same Study.</p></div>
      </div>
      <p class="trustline">No source, no claim. This prototype uses invented documents only.</p>
    </section>
  </main>`;
}

function library() {
  const hives = Object.values(DATA.S).filter((x) => x.docs && x.exceptions);
  return `${topbar()}<main class="main"><div class="col wide">
    <div class="pagehead"><div><h1 class="t-title">My hives</h1><p>One hive for each situation, with its documents, findings and reports.</p></div><div class="actions">${btn(`${icon("plus")} New hive`, "new", "primary")}</div></div>
    <div class="hivelist" style="border-top:1px solid var(--ink)">
      ${hives.map((x) => {
        const open = x.exceptions.filter((e) => !e.hidden).length;
        return `<button class="hrow" data-open="${x.id}"><span class="hive-initials">${initials(x.hiveTitle.replace(/'s\b/, ""))}</span><span><span class="t-item" style="display:block">${esc(x.hiveTitle)}</span><span class="t-meta">${esc(x.purpose)}</span></span><span class="t-meta num hide-sm">${x.docs.length} documents · Study v${x.studyRev}</span><span class="status ${open ? "coral" : "leaf"}">${open ? `${open} to review` : "Up to date"}</span></button>`;
      }).join("")}
      ${state.created.map((x, i) => `<button class="hrow" data-custom="${i}"><span class="hive-initials">${initials(x.title) || "H"}</span><span><span class="t-item" style="display:block">${esc(x.title)}</span><span class="t-meta">${esc(x.desc || "No documents yet")}</span></span><span class="t-meta hide-sm">No documents</span><span class="status grey">Empty</span></button>`).join("")}
    </div>
  </div></main>`;
}

function customEmpty() {
  const x = state.created[state.customIndex];
  return `${topbar()}<main class="main"><div class="col" style="text-align:center;padding-top:64px">
    <h1 class="t-title">${esc(x.title)}</h1><p class="t-lead" style="margin:10px 0 28px">No documents yet. Upload whatever you have — old, partial or out of order is fine.</p>
    ${btn(`${icon("upload")} Add documents`, "upload", "primary")}</div></main>`;
}

/* ───────────── Drawer ───────────── */

function drawer() {
  const d = state.drawer;
  if (!d) return "";
  const s = S();
  let title = "", body = "", foot = "";
  if (d.type === "evidence") {
    const e = ev(d.id), x = doc(e.doc);
    title = `${x.role} · page ${e.page}`;
    const st = e.status === "verified" ? status("Checked against the page", "leaf") : e.status === "unreadable" ? status("Unreadable", "coral") : status("Uncertain", "honey");
    body = `${st}<div class="excerpt"><div class="src">${esc(x.org || "Source document")} · page ${e.page} of ${x.pages}</div>“<mark>${esc(e.quote)}</mark>”</div>
      <h4>What this supports</h4><p>${esc(e.supports)}</p>${e.unc ? `<h4>Why it's uncertain</h4><p>${esc(e.unc)}</p>` : ""}
      <p class="t-meta" style="margin-top:24px">Prototype excerpt from a synthetic page. The app shows the real page image here.</p>`;
  } else if (d.type === "doc") {
    const x = doc(d.id);
    const linked = Object.entries(s.ev).filter(([, e]) => e.doc === x.id);
    title = x.role;
    body = `<dl class="dl" style="margin-top:0"><dt>What it is</dt><dd>${esc(x.type)}</dd><dt>Period</dt><dd>${esc(x.period)}</dd><dt>Pages</dt><dd class="num">${x.pages}</dd><dt>Read</dt><dd>${x.cov == null ? "Not read yet" : x.cov + "%"}</dd><dt>Issued by</dt><dd>${esc(x.org || "—")}</dd><dt>File</dt><dd>${esc(x.file)}</dd></dl>
      ${x.flags.map((f) => `<p style="margin-top:12px">${status("Note", "honey")} ${esc(f.t)}</p>`).join("")}
      <h4>Findings that cite this document</h4><div class="rows">${linked.map(([id, e]) => `<div class="row"><p>${esc(e.supports)}</p>${refs([id])}</div>`).join("") || `<p class="muted">None yet.</p>`}</div>`;
  } else if (d.type === "issue") {
    const x = s.exceptions.find((a) => a.id === d.id);
    const k = KIND[x.kind] || KIND.needs;
    title = "Review";
    body = `${status(k.word, k.tone)}<h3 class="t-section" style="margin:10px 0 8px">${esc(x.title)}</h3><p>${esc(x.detail)}</p>
      <h4>Why it matters</h4><p>${esc(x.why)}</p><h4>Pages</h4>${refs(x.ev)}
      ${x.question ? `<h4>Worth asking</h4><p>${esc(x.question)}</p>` : ""}${x.request ? `<h4>Document to request</h4><p>${esc(x.request)}</p>` : ""}
      <label class="field"><span>Note (optional)</span><textarea id="review-note" placeholder="What you know, or what you asked for…">${esc(state.notes[x.id] || "")}</textarea></label>`;
    foot = `<div style="display:flex;gap:8px;flex-wrap:wrap">${btn(x.acceptLabel || "Mark reviewed", "resolve:reviewed", "primary")}${btn("Not applicable", "resolve:not applicable", "")}</div><p class="t-meta" style="margin-top:10px">A decision records your answer. It never changes the document.</p>`;
  } else if (d.type === "matrix") {
    const [r, c] = d.id.split(":").map(Number), m = s.matrix, v = m.rows[r].cells[c];
    title = `${m.rows[r].label} · ${m.cols[c]}`;
    body = `<p>${esc(v.note)}</p>${refs(v.ev)}${v.x ? `<div style="margin-top:16px">${btn("Review this gap", "issue:" + v.x, "")}</div>` : ""}`;
  } else if (d.type === "calc") {
    const c = s.calcs[d.id];
    title = c.title;
    body = `<dl class="glance" style="margin-top:0"><div><dt>Result</dt><dd>${esc(calcValue(d.id))}</dd></div></dl><h4>Method</h4><p>${esc(c.method)}</p><h4>Inputs</h4>
      <div class="rows">${c.inputs.filter((i) => !i.when || state.decisions[i.when.x] === i.when.status).map((i) => `<div class="row" style="display:flex;justify-content:space-between;gap:12px"><div><p>${esc(i.label)}</p>${refs([i.ev])}</div><span class="num">${i.sign < 0 ? "−" : "+"}${esc(i.value)}</span></div>`).join("")}</div>
      <p class="t-meta" style="margin-top:12px">Recomputed from the numbers on the pages; the model's arithmetic is never trusted.</p>`;
  } else if (d.type === "new") {
    title = "New hive";
    body = `<form id="create-form"><label class="field" style="margin-top:0"><span>Name</span><input id="hive-title" required maxlength="100" placeholder="e.g. Mom's paperwork"></label><label class="field"><span>What are you trying to understand? (optional)</span><textarea id="hive-desc" maxlength="500"></textarea></label><div style="margin-top:20px"><button class="btn primary" type="submit">Create hive</button></div></form>`;
  } else if (d.type === "upload") {
    title = "Add documents";
    body = `<p>PDFs, photos or Word files. Old, partial or out of order is fine.</p><label class="field"><span>Choose files</span><input id="file-pick" type="file" accept=".pdf,.png,.jpg,.jpeg,.heic,.docx" multiple></label><p class="t-meta" style="margin-top:12px">In this prototype only the file names are listed; nothing is read.</p>`;
  }
  return `<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1">
    <header><h2 class="t-section">${esc(title)}</h2><button class="btn quiet sm" data-action="close" aria-label="Close">${icon("x")}</button></header>
    <div class="content">${body}</div>${foot ? `<div style="padding:16px 24px;border-top:1px solid var(--line)">${foot}</div>` : ""}</aside>`;
}

/* ───────────── Render and events ───────────── */

function render() {
  const html = state.view === "landing" ? landing() : state.view === "library" ? library() : state.view === "custom" ? customEmpty() : workspace();
  $("#app").innerHTML = html + drawer() + (state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : "");
  if (state.drawer) $(".drawer")?.focus();
  watchToc();
}
let tocObserver;
function watchToc() {
  tocObserver?.disconnect();
  const links = [...document.querySelectorAll("[data-toc]")];
  if (!links.length) return;
  tocObserver = new IntersectionObserver((entries) => {
    const top = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (top) links.forEach((l) => l.toggleAttribute("aria-current", l.dataset.toc === top.target.id));
  }, { rootMargin: "-80px 0px -60% 0px" });
  links.forEach((l) => { const el = document.getElementById(l.dataset.toc); if (el) tocObserver.observe(el); });
}
function toast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = ""; $(".toast")?.remove(); }, 3000);
}
function navigate(view, tab) {
  state.view = view;
  if (tab) state.tab = tab;
  state.drawer = null;
  render();
  scrollTo(0, 0);
}
function scrollThread() { const t = $("#thread"); t?.lastElementChild?.scrollIntoView({ block: "nearest" }); }

function action(a) {
  if (a === "send") {
    const el = $("#draft"), text = (el?.value || "").trim();
    if (!text) return el?.focus();
    const who = state.boardActor;
    messages().push({ role: who, text, time: "Just now" });
    state.boardDraft = "";
    const asks = who === "client" || new RegExp(`^@?${P().assistant}\\b`, "i").test(text);
    if (asks) {
      state.typing = true;
      render(); scrollThread();
      setTimeout(() => { const r = assistantReply(text); messages().push({ role: "assistant", text: r.text, ev: r.ev, time: "Just now" }); state.typing = false; render(); scrollThread(); }, 900);
    } else { render(); scrollThread(); }
    return;
  }
  if (a === "addnote") {
    const el = $("#note"), text = (el?.value || "").trim();
    if (!text) return el?.focus();
    state.teamNotes[state.scenario].push({ who: "Priya Shah", when: "Just now", text });
    state.noteDraft = "";
    return render();
  }
  if (a === "landing" || a === "library") return navigate(a);
  if (a === "how") { navigate("landing"); return setTimeout(() => $("#how-it-works")?.scrollIntoView({ behavior: "smooth" }), 10); }
  if (a === "new" || a === "upload") { state.drawer = { type: a }; return render(); }
  if (a === "close") { state.drawer = null; return render(); }
  if (a === "generate") {
    state.reportMade = true;
    (state.reportHistory[state.scenario] ??= []).unshift({ audience: state.reportAudience, at: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) });
    return render();
  }
  if (a === "print") return print();
  if (a === "clearfind") { state.find = ""; render(); return $("#find")?.focus(); }
  const [kind, id] = [a.slice(0, a.indexOf(":")), a.slice(a.indexOf(":") + 1)];
  if (kind === "doc" || kind === "issue" || kind === "calc") { state.drawer = { type: kind, id }; return render(); }
  if (kind === "resolve") {
    const issue = state.drawer.id;
    state.notes[issue] = $("#review-note")?.value || "";
    state.decisions[issue] = id;
    state.drawer = null;
    return toast("Decision recorded for this demo session.");
  }
}

document.addEventListener("click", (e) => {
  if (e.target.id === "scrim") { state.drawer = null; return render(); }
  const t = e.target.closest("[data-action],[data-open],[data-tab],[data-scenario],[data-evidence],[data-audience],[data-matrix],[data-history],[data-custom],[data-filter],[data-expand],[data-kind]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.action) return action(ds.action);
  if (ds.open) { state.scenario = ds.open; state.reportMade = false; state.expanded = {}; state.find = ""; state.kindFilter = "all"; return navigate("workspace", "board"); }
  if (ds.custom != null) { state.customIndex = +ds.custom; return navigate("custom"); }
  if (ds.tab) return navigate("workspace", ds.tab);
  if (ds.scenario) { state.scenario = ds.scenario; state.intent = DATA.S[ds.scenario].ask; state.reportMade = false; return navigate("workspace", "board"); }
  if (ds.evidence) { state.drawer = { type: "evidence", id: ds.evidence }; return render(); }
  if (ds.audience) { state.reportAudience = ds.audience; return render(); }
  if (ds.matrix) { state.drawer = { type: "matrix", id: ds.matrix }; return render(); }
  if (ds.filter) { state.filter = ds.filter; return render(); }
  if (ds.expand) { state.expanded[ds.expand] = !state.expanded[ds.expand]; return render(); }
  if (ds.kind) { state.kindFilter = ds.kind; state.expanded.review = false; return render(); }
  if (ds.history != null) { const r = (state.reportHistory[state.scenario] || [])[+ds.history]; if (r) { state.reportAudience = r.audience; state.reportMade = true; render(); } }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "jump" && e.target.value) { document.getElementById(e.target.value)?.scrollIntoView({ behavior: "smooth", block: "start" }); e.target.value = ""; return; }
  if (e.target.id === "actor") { state.boardActor = e.target.value; state.boardDraft = $("#draft")?.value || ""; return render(); }
  if (e.target.id === "file-pick") {
    const files = Array.from(e.target.files || []);
    state.fakeUploads.push(...files.map((f) => ({ name: f.name })));
    state.drawer = null;
    state.tab = "documents";
    toast(`${files.length} file name(s) listed. Nothing was read.`);
  }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "intent-form") {
    state.intent = $("#intent")?.value || "";
    if (!state.intent.trim()) return action("library");
    const q = state.intent.toLowerCase();
    state.scenario = /iep|school|special education/.test(q) ? "iep" : /insurance|claim|adjuster|contractor/.test(q) ? "insurance" : "medicaid";
    navigate("workspace", "board");
    toast("Opened a related sample hive. Your text wasn't analyzed.");
  }
  if (e.target.id === "create-form") {
    const title = $("#hive-title").value.trim();
    if (!title) return;
    state.created.push({ title, desc: $("#hive-desc").value.trim() });
    state.customIndex = state.created.length - 1;
    navigate("custom");
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "draft") state.boardDraft = e.target.value;
  if (e.target.id === "note") state.noteDraft = e.target.value;
  if (e.target.id === "find") {
    const pos = e.target.selectionStart;
    state.find = e.target.value;
    render();
    const f = $("#find"); f.focus(); f.setSelectionRange(pos, pos);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.drawer) { state.drawer = null; render(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "draft") { e.preventDefault(); action("send"); }
});
render();
</script></body></html>
