function sarahReply(q){let s=scenario(),t=q.toLowerCase(),issues=currentIssues();let matching=issues.find(x=>x.title.toLowerCase().split(' ').some(w=>w.length>5&&t.includes(w)));if(/missing|gap|documents|statement|need|request/.test(t)){let arr=issues.filter(x=>x.kind==='missing');let chosen=matching||arr[0];return chosen?{text:`I can help organize that request. The sample records show: ${chosen.detail} I’ve kept this as an open onboarding item; please confirm whether you can provide it.`,ev:chosen.ev}: {text:'The sample currently has no open missing-document items. The original sources remain available in Documents.'}}if(/transfer|compare|change|different|speech|estimate/.test(t)){let x=matching||issues.find(x=>x.kind==='changed')||issues[0];return x?{text:`Here is the relevant point from the sample: ${x.detail} This is a source-backed observation, not a final decision.`,ev:x.ev}:{text:'I can help compare accepted document statements. Open Facts for the full evidence-backed view.'}}if(/next|start|plan|process|help|onboard/.test(t)){let todo=s.tasks.find(x=>!['COMPLETED','SKIPPED'].includes(x.state));return {text:todo?`A useful next step is “${todo.title}.” ${todo.does} The onboarding specialist can confirm the request and follow up with you.`:'The sample work plan has no additional steps listed.'}}return {text:'I can help clarify what the uploaded sample documents say, point to evidence, and prepare a missing-document request. For a new question, I will flag it for the onboarding specialist rather than invent an answer.'};}

function overview(){const s=scenario();const focus=currentIssues().slice(0,3);return `${statebar()}<div class="stats"><div class="stat"><span class="eyebrow">Documents</span><strong>${s.docs.length}</strong><span class="small muted">Uploaded sources</span></div><div class="stat"><span class="eyebrow">Study</span><strong>v${s.studyRev}</strong><span class="small muted">Accepted revision</span></div><div class="stat"><span class="eyebrow">Needs attention</span><strong>${currentIssues().length}</strong><span class="small muted">Questions and gaps</span></div><div class="stat"><span class="eyebrow">Work plan</span><strong>${s.tasks.filter(t=>t.state==='COMPLETED').length}/${s.tasks.length}</strong><span class="small muted">Steps completed</span></div></div><div class="askbar"><span style="margin-left:10px;color:var(--deep)">${icon('search')}</span><input id="ask" aria-label="Ask about these documents" placeholder="Ask anything about these documents…" value="${escapeHtml(state.query)}"><button class="btn primary" data-action="ask">Explore ${icon('arrow')}</button></div><div class="cols"><div class="stack"><section class="card"><div class="section-head"><h3>The picture so far</h3>${btn('Explore Study','study','ghost sm')}</div><p class="sub small" style="margin-bottom:15px">${escapeHtml(s.goal)}</p>${s.understand.groups.slice(0,3).map(g=>`<div class="rowitem"><div class="file-icon" style="height:32px;width:32px">${icon('check')}</div><div class="content"><strong>${escapeHtml(g.title)}</strong>${g.items.slice(0,2).map(it=>`<p>${escapeHtml(it.text)}</p>${chips(it.ev)}`).join('')}</div></div>`).join('')}</section><section class="card"><div class="section-head"><h3>What changed over time</h3>${btn('Full timeline','timeline','ghost sm')}</div>${s.timeline.slice(-4).map(t=>`<div class="rowitem"><div class="content"><strong>${escapeHtml(t.date)}</strong><p>${escapeHtml(t.text)}</p>${chips(t.ev)}</div></div>`).join('')}</section></div><div class="stack"><section class="card"><div class="section-head"><h3>Worth your attention</h3>${btn('View all','review','ghost sm')}</div>${focus.length?focus.map(x=>`<div class="rowitem"><div class="content"><div style="margin-bottom:6px">${badge(x.kind==='missing'?'Missing':x.kind==='changed'?'Changed':'Needs you',x.kind==='missing'?'coral':x.kind==='changed'?'honey':'blue')}</div><strong>${escapeHtml(x.title)}</strong><p>${escapeHtml(x.detail)}</p>${chips(x.ev)}<div>${btn('Review this','issue:'+x.id,'sm')}</div></div></div>`).join(''):'<p class="sub">No unresolved items in this demo state.</p>'}</section><section class="card"><div class="section-head"><h3>Next useful steps</h3>${btn('Work plan','plan','ghost sm')}</div>${s.tasks.filter(t=>!['COMPLETED','SKIPPED'].includes(t.state)).slice(0,4).map(t=>`<div class="rowitem"><div class="content"><strong>${escapeHtml(t.title)}</strong><p>${escapeHtml(t.does)}</p>${badge(t.state.replaceAll('_',' ').toLowerCase(),t.state==='FAILED'?'coral':'')}</div></div>`).join('')}</section></div></div>`}
function documents(){const s=scenario();const docs=s.docs.filter(d=>state.filter==='all'||(state.filter==='attention'&&(d.flags.length||d.cov!==100))||(state.filter==='ready'&&d.cov===100&&!d.flags.length));return `${statebar()}<section class="card"><div class="section-head"><div><h3>Source library</h3><p class="sub small">${s.docs.length} original files; document names are never used as evidence citations.</p></div><div class="flex"><select id="docfilter" aria-label="Filter documents" style="border:1px solid var(--line);border-radius:9px;padding:7px"><option value="all" ${state.filter==='all'?'selected':''}>All documents</option><option value="attention" ${state.filter==='attention'?'selected':''}>Needs attention</option><option value="ready" ${state.filter==='ready'?'selected':''}>Read completely</option></select>${btn(`${icon('plus')} Add files`,'upload','sm')}</div></div><div class="scrolltable"><table class="data-table"><thead><tr><th>Document</th><th>Period / date</th><th>Pages</th><th>Read state</th><th></th></tr></thead><tbody>${docs.map(d=>`<tr><td><strong>${escapeHtml(d.role)}</strong><div class="tiny muted">${escapeHtml(d.file)}</div><div class="tiny muted">${escapeHtml(d.type)}</div></td><td>${escapeHtml(d.period)}</td><td>${d.pages}</td><td>${d.dup?badge('Duplicate','honey'):d.cov===100?badge('Pages read','green'):badge(d.cov==null?'Not reviewed':d.cov+'% read','coral')}<div class="tiny muted" style="margin-top:5px">${escapeHtml(d.flags.map(f=>f.t).join('; '))}</div></td><td>${btn('Inspect','doc:'+d.id,'sm')}</td></tr>`).join('')}</tbody></table></div></section><div class="notice" style="margin-top:17px">Reading a page is not the same as proving its statements true. Supporting evidence is verified against what the source says; gaps and unreadable pages remain visible.</div>${state.fakeUploads.length?`<section class="card" style="margin-top:18px"><h3>Files added during this demo</h3>${state.fakeUploads.map(f=>`<div class="rowitem"><div class="content"><strong>${escapeHtml(f.name)}</strong><p>Local demo registration only · Not read or analyzed</p></div>${badge('Not processed','honey')}</div>`).join('')}</section>`:''}`}
function study(){const s=scenario();const subs=[['understand','What we know'],['compare','Compare'],['coverage','Coverage'],['timeline','Timeline'],['questions','Questions'],['attention','Needs attention']];return `<div class="notice" style="margin-bottom:16px">Accepted Study v${s.studyRev} · All insights below use invented sample evidence; an accepted source observation does not certify real-world truth.</div><div class="askbar"><span style="margin-left:10px;color:var(--deep)">${icon('search')}</span><input id="ask" placeholder="What would you like to understand?" aria-label="Study question" value="${escapeHtml(state.query)}"><button data-action="ask" class="btn primary">Ask ${icon('arrow')}</button></div><div class="tabs">${subs.map(([k,t])=>`<button class="${state.studyTab===k?'active':''}" data-study="${k}">${t}</button>`).join('')}</div>${state.studyTab==='understand'?studyUnderstand():state.studyTab==='compare'?studyCompare():state.studyTab==='coverage'?coverage():state.studyTab==='timeline'?timeline(true):state.studyTab==='attention'?review():questions()}`}

ucational or medical advice.</div></article>`}

function drawerContent(){const d=state.drawer;if(!d)return '';const s=scenario();let title='',content='';if(d.type==='evidence'){let e=evObj(d.id),doc=docObj(e.doc);title='Source evidence';content=`${badge(e.status==='verified'?'Verified source attribution':e.status==='unreadable'?'Unreadable':'Uncertain',e.status==='verified'?'green':'honey')}<h3 style="margin:17px 0 10px">${escapeHtml(doc.role)}</h3><p class="sub small">${escapeHtml(doc.file)} · Physical page ${e.page} of ${doc.pages}</p><div class="docpage"><div class="eyebrow">${escapeHtml(doc.org||'Source document')}</div><div class="divider"></div><p class="sub small">Document page ${e.page} · Synthetic reconstruction of evidence excerpt</p><div class="quote">“${escapeHtml(e.quote)}”</div><p class="tiny muted">This is a sample excerpt, not a full original PDF page or a verified visual highlight.</p></div><h4>What this supports</h4><p class="sub" style="margin-top:8px">${escapeHtml(e.supports)}</p>${e.unc?`<div class="notice" style="margin-top:15px">${escapeHtml(e.unc)}</div>`:''}`}
else if(d.type==='doc'){let x=docObj(d.id);title='Document details';let related=Object.entries(s.ev).filter(([id,e])=>e.doc===x.id);content=`<div class="flex"><span class="file-icon">${icon('file')}</span><div><h3>${escapeHtml(x.role)}</h3><p class="small muted">${escapeHtml(x.file)}</p></div></div><div class="divider"></div><p><b>Type:</b> ${escapeHtml(x.type)}</p><p><b>Period:</b> ${escapeHtml(x.period)}</p><p><b>Page count:</b> ${x.pages}</p><p><b>Read coverage:</b> ${x.cov==null?'Not checked':x.cov+'%'}</p><p><b>Issuer:</b> ${escapeHtml(x.org||'Unspecified')}</p>${x.flags.map(f=>`<div class="notice" style="margin-top:14px">${escapeHtml(f.t)}</div>`).join('')}<h3 style="margin:28px 0 10px">Evidence linked to this file</h3>${related.length?related.map(([id,e])=>`<div class="rowitem"><div class="content"><p>${escapeHtml(e.supports)}</p>${chip(id)}</div></div>`).join(''):'<p class="sub small">No linked evidence in this demo.</p>'}`}
else if(d.type==='issue'){let x=s.exceptions.find(a=>a.id===d.id);title='Review item';content=`${badge(x.kind==='missing'?'Missing':x.kind==='changed'?'Changed':'Needs you',x.kind==='missing'?'coral':x.kind==='changed'?'honey':'blue')}<h3 style="margin:15px 0">${escapeHtml(x.title)}</h3><p>${escapeHtml(x.detail)}</p><h4 style="margin-top:23px">Why it matters</h4><p class="sub" style="margin-top:7px">${escapeHtml(x.why)}</p><h4 style="margin-top:23px">Supporting pages</h4><div style="margin:8px 0 20px">${chips(x.ev)}</div>${x.question?`<div class="notice">Worth asking: ${escapeHtml(x.question)}</div>`:''}${x.request?`<div class="notice">Possible document request: ${escapeHtml(x.request)}</div>`:''}<label class="formfield"><span>Your note (optional)</span><textarea id="review-note" placeholder="Record your explanation or question…">${escapeHtml(state.notes[x.id]||'')}</textarea></label><div class="flex wrap">${btn(x.acceptLabel||'Mark reviewed','resolve:reviewed','primary')}${x.rejectLabel?btn(x.rejectLabel,'resolve:rejected',''):''}${btn('Not applicable','resolve:not applicable','')}</div><p class="small muted" style="margin-top:15px">A review decision records your input. It never rewrites the underlying document.</p>`}
else if(d.type==='matrix'){let [r,c]=d.id.split(':').map(Number),m=s.matrix,v=m.rows[r].cells[c];title='Coverage detail';content=`<h3>${escapeHtml(m.rows[r].label)} · ${escapeHtml(m.cols[c])}</h3><p class="sub" style="margin:17px 0">${escapeHtml(v.note)}</p>${badge(v.s,v.s==='complete'?'green':v.s==='gap'?'coral':'honey')}<h4 style="margin-top:25px">Related evidence</h4>${chips(v.ev)}${v.x?`<div style="margin-top:20px">${btn('Review this gap','issue:'+v.x,'primary')}</div>`:''}`}
else if(d.type==='calc'){let c=s.calcs[d.id];title='Calculation detail';content=`<h3>${escapeHtml(c.title)}</h3><div class="stat" style="margin:20px 0"><span class="eyebrow">Calculated result</span><strong>${escapeHtml(calcDisplay(d.id))}</strong></div><h4>Method</h4><p class="sub" style="margin:8px 0 20px">${escapeHtml(c.method)}</p><h4>Included inputs</h4>${c.inputs.filter(i=>!i.when||state.decisions[i.when.x]===i.when.status).map(i=>`<div class="rowitem"><div class="content"><strong>${escapeHtml(i.label)}</strong><p>${i.sign<0?'−':'+'}${escapeHtml(i.value)}</p>${chip(i.ev)}</div></div>`).join('')}<p class="small muted" style="margin-top:15px">Values are recomputed from the sample numeric inputs; no model arithmetic is trusted as the result.</p>`}
else if(d.type==='new'){title='Create a hive';content=`<p class="sub">Give this situation a name. A new hive starts empty; nothing is treated as analyzed until a real processing workflow succeeds.</p><form id="create-form"><label class="formfield"><span>Hive name</span><input id="hive-title" required maxlength="100" placeholder="e.g., Mom’s paperwork"/></label><label class="formfield"><span>Description (optional)</span><textarea id="hive-desc" maxlength="500" placeholder="What are you trying to understand?"></textarea></label><button class="btn primary" type="submit">Create demo hive</button></form>`}
else if(d.type==='upload'){title='Add documents';content=`<h3>Add source files</h3><p class="sub small" style="margin:12px 0">In this demo, selected file names appear in Documents only. No file contents leave your computer, and no analysis is performed.</p><label class="formfield"><span>Select files · PDF, PNG, JPG, DOCX</span><input id="file-pick" type="file" accept=".pdf,.png,.jpg,.jpeg,.docx" multiple></label><div class="notice">The production workflow would register private originals, read physical pages, verify evidence and update the Study only after successful validation.</div><div style="margin-top:20px">${btn('Close','close','')}</div>`}
return `<div class="panel-backdrop" id="overlay"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="drawer-header"><h3>${escapeHtml(title)}</h3><button class="btn sm" data-action="close" aria-label="Close">${icon('x')}</button></div>${content}</aside></div>`}
function customEmpty(){let x=state.created[state.customIndex];return `${topbar()}<main class="page"><div class="crumb"><button data-action="library">My hives</button> / ${escapeHtml(x.title)}</div><div class="empty card" style="max-width:730px;margin:50px auto"><h2>${escapeHtml(x.title)}</h2><p class="sub" style="margin:12px 0 26px">No documents yet. No Study has been created.</p>${btn(`${icon('upload')} Add documents`,'upload','primary')}<p class="muted small" style="margin-top:16px">Demo uploads are not processed or stored.</p></div></main>`}
function render(){let html=state.view==='landing'?landing():state.view==='library'?library():state.view==='custom'?customEmpty():workspace();$('#app').innerHTML=html+(state.drawer?drawerContent():'')+(state.toast?`<div class="toast" role="status">${escapeHtml(state.toast)}</div>`:'');if(state.drawer){$('.drawer')?.focus();} }
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast='';$('.toast')?.remove()},3000)}
function navigate(view,tab){state.view=view;if(tab)state.tab=tab;state.drawer=null;render();scrollTo(0,0)}
function action(a){if(a==='board-send'){let el=$('#board-draft'),txt=(el?.value||'').trim();if(!txt){el?.focus();return}let who=state.boardActor;boardMessages().push({role:who,name:who==='staff'?'Onboarding specialist':'Client',text:txt,time:'Just now'});state.boardDraft='';let lower=txt.toLowerCase();if(who==='client'||/sarah|help|what|which|missing|next|compare|review|check/i.test(txt)){let answer=sarahReply(txt);boardMessages().push({role:'sarah',name:'Sarah · AI assistant',text:answer.text,time:'Just now',ev:answer.ev});}render();$('#board-messages')?.scrollTo({top:$('#board-messages').scrollHeight});return}if(a==='board-ask-sarah'){state.boardDraft='What should we do next?';let answer=sarahReply(state.boardDraft);boardMessages().push({role:'sarah',name:'Sarah · AI assistant',text:answer.text,time:'Just now',ev:answer.ev});state.boardDraft='';render();$('#board-messages')?.scrollTo({top:$('#board-messages').scrollHeight});return}if(a.startsWith('board-request:')){let r=boardRequests().find(x=>x.id===a.slice(14));if(!r)return;let issue=scenario().exceptions.find(x=>x.id===r.id);if(r.status==='Open'||r.status==='Requested'){boardMessages().push({role:'staff',name:'Onboarding specialist',text:`Document request: ${issue.request||issue.title} Please let us know whether you can supply this, or if it is not applicable.`,time:'Just now',ev:issue.ev});r.status='Requested';}render();$('#board-messages')?.scrollTo({top:$('#board-messages').scrollHeight});return}if(a==='landing'||a==='library'){navigate(a);return}if(a==='how'){navigate('landing');setTimeout(()=>$('#how-it-works')?.scrollIntoView({behavior:'smooth'}),10);return}if(a==='new'||a==='upload'){state.drawer={type:a};render();return}if(a==='close'){state.drawer=null;render();return}if(a==='review'){state.studyTab='attention';navigate('workspace','study');return}if(a==='timeline'){state.studyTab='timeline';navigate('workspace','study');return}if(a==='study'||a==='documents'||a==='overview'||a==='plan'||a==='reports'||a==='audit'){navigate('workspace',a);return}if(a==='ask'){state.query=$('#ask')?.value||state.query;if(!state.query.trim())return toast('Type a question to explore the Study.');state.studyTab=/missing|gap|cover/i.test(state.query)?'coverage':/compare|difference|change/i.test(state.query)?'compare':/timeline|when|date/i.test(state.query)?'timeline':/question|ask|meeting/i.test(state.query)?'questions':'understand';navigate('workspace','study');toast('Showing a relevant view of the synthetic Study. No new model analysis was run.');return}if(a==='generate'){state.reportMade=true;(state.reportHistory[state.scenario]??=[]).unshift({audience:state.reportAudience});render();return}if(a==='print'){print();return}if(a.startsWith('doc:')){state.drawer={type:'doc',id:a.slice(4)};render();return}if(a.startsWith('issue:')){state.drawer={type:'issue',id:a.slice(6)};render();return}if(a.startsWith('calc:')){state.drawer={type:'calc',id:a.slice(5)};render();return}if(a.startsWith('undo:')){delete state.decisions[a.slice(5)];render();return}if(a.startsWith('resolve:')){let id=state.drawer.id;state.notes[id]=$('#review-note')?.value||'';state.decisions[id]=a.slice(8);state.drawer=null;toast('Review response recorded for this demo session.');return}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-board-prompt],[data-action],[data-open],[data-tab],[data-study],[data-scenario],[data-evidence],[data-audience],[data-matrix],[data-history],[data-custom]');if(!t){if(e.target.id==='overlay'){state.drawer=null;render()}return}if(t.dataset.boardPrompt){state.boardDraft=t.dataset.boardPrompt;render();$('#board-draft')?.focus();return}if(t.dataset.action){action(t.dataset.action);return}if(t.dataset.open){state.scenario=t.dataset.open;state.tab='overview';state.reportMade=false;navigate('workspace');return}if(t.dataset.custom!=null){state.customIndex=+t.dataset.custom;navigate('custom');return}if(t.dataset.tab){if(t.dataset.tab==='review'||t.dataset.tab==='timeline'){state.studyTab=t.dataset.tab==='review'?'attention':'timeline';navigate('workspace','study')}else navigate('workspace',t.dataset.tab);return}if(t.dataset.study){state.studyTab=t.dataset.study;render();return}if(t.dataset.scenario){state.scenario=t.dataset.scenario;state.tab='overview';state.intent=DATA.S[state.scenario].ask;state.reportMade=false;navigate('workspace');return}if(t.dataset.evidence){state.drawer={type:'evidence',id:t.dataset.evidence};render();return}if(t.dataset.audience){state.reportAudience=t.dataset.audience;render();return}if(t.dataset.matrix){state.drawer={type:'matrix',id:t.dataset.matrix};render();return}if(t.dataset.history!=null){let r=(state.reportHistory[state.scenario]||[])[+t.dataset.history];if(r){state.reportAudience=r.audience;state.reportMade=true;render()}return}});
document.addEventListener('change',e=>{if(e.target.id==='board-actor'){state.boardActor=e.target.value;state.boardDraft=$('#board-draft')?.value||'';render();return}if(e.target.id==='docfilter'){state.filter=e.target.value;render()}if(e.target.id==='file-pick'){const files=Array.from(e.target.files||[]);const allowed=['pdf','png','jpg','jpeg','docx'];const good=files.filter(f=>allowed.includes(f.name.toLowerCase().split('.').pop()));state.fakeUploads.push(...good.map(f=>({name:f.name,size:f.size})));state.drawer=null;state.tab='documents';toast(`${good.length} file name(s) added to the demo. No content was read.`)}});
document.addEventListener('submit',e=>{if(e.target.id==='intent-form'){e.preventDefault();state.intent=$('#intent')?.value||'';if(!state.intent.trim()){action('library');return}let q=state.intent.toLowerCase();state.scenario=/iep|school|special education/.test(q)?'iep':/insurance|claim|adjuster|contractor/.test(q)?'insurance':'medicaid';state.query=state.intent;state.studyTab='understand';state.tab='overview';navigate('workspace');toast('Loaded a related synthetic sample; your request was not analyzed.')}if(e.target.id==='create-form'){e.preventDefault();let title=$('#hive-title').value.trim();if(!title)return;state.created.push({title,desc:$('#hive-desc').value.trim()});state.customIndex=state.created.length-1;navigate('custom')}});
document.addEventListener('input',e=>{if(e.target.id==='board-draft')state.boardDraft=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.drawer){state.drawer=null;render()}if(e.key==='Enter'&&e.target.matches('[data-open],[data-custom]'))e.target.click()});render();
</script></body></html>
