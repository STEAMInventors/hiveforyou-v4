<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiveForYou — concept v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* HiveForYou concept v5 — the whole flow: front page, sign-in, your hives, then the hive ("the file explains itself").
   Brand guide v1.0 colours and faces. DESIGN.md v4 is the written spec; where they differ, DESIGN.md wins. */
:root {
  --ink: #1f2328; --ink-2: #4a525c; --ink-3: #6b737d;
  --line: #e3e6ea; --line-2: #d3d8de; --mist: #f4f6f8; --paper: #fff; --hover: #eef1f4;
  --blue: #3b7cf6; --blue-deep: #1a56c4; --blue-wash: #e8f0fe;
  --coral: #ef5143; --coral-deep: #b33a2e; --coral-wash: #fdedeb;
  --honey: #f6b826; --honey-deep: #7a5200; --honey-wash: #fef3d6;
  --leaf: #2fa35a; --leaf-deep: #197040; --leaf-wash: #e6f4ea;
  --display: "Outfit", system-ui, sans-serif; --body: "DM Sans", system-ui, sans-serif; --page: "Source Serif 4", Georgia, serif;
  --lift: 0 1px 2px rgba(16,24,40,.05), 0 12px 32px -16px rgba(16,24,40,.18);
  --pop: 0 2px 6px rgba(16,24,40,.06), 0 24px 56px -20px rgba(16,24,40,.28);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14.5px/1.55 var(--body); -webkit-font-smoothing: antialiased; letter-spacing: -0.003em; }
::selection { background: #cfe0fd; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.meta { font-size: 12.5px; color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--paper); font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.primary:hover { background: #1647a3; }
.btn.text { border-color: transparent; background: none; color: var(--blue-deep); padding: 0 6px; }
.btn.text:hover { background: var(--blue-wash); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); }
.btn.quiet:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }

/* Status: dot + word */
.dot { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.dot.coral { color: var(--coral-deep); } .dot.honey { color: var(--honey-deep); } .dot.honey::before { background: var(--honey); }
.dot.blue { color: var(--blue-deep); } .dot.leaf { color: var(--leaf-deep); } .dot.grey { color: var(--ink-3); }

/* Source reference */
.ref { display: inline-flex; align-items: center; gap: 5px; height: 24px; max-width: 100%; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; opacity: .7; flex: none; }
.ref .pg { color: var(--ink-3); }
.ref:hover { background: var(--blue-wash); border-color: #c9d9fb; color: var(--blue-deep); }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* Avatars */
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; flex: none; }
.av.client { background: var(--leaf-wash); color: var(--leaf-deep); box-shadow: inset 0 0 0 1px rgba(25,112,64,.18); }
.av.staff { background: var(--blue-wash); color: var(--blue-deep); box-shadow: inset 0 0 0 1px rgba(26,86,196,.16); }
.av.ai { background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); }
.av.ai svg { width: 14px; height: 18px; }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.stack { display: flex; }
.stack .av { box-shadow: 0 0 0 2px var(--paper); }
.stack .av + .av { margin-left: -6px; }

/* ── Top bar with the one input ── */
.top { position: sticky; top: 0; z-index: 40; display: grid; grid-template-columns: 1fr minmax(0, 600px) 1fr; align-items: center; gap: 16px; height: 64px; padding: 0 20px; background: rgba(255,255,255,.9); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 9px; border: 0; background: none; padding: 0; font-family: var(--display); font-size: 18px; letter-spacing: -0.035em; }
.brand b { font-weight: 600; } .brand span { font-weight: 400; }
.brand svg { width: 21px; height: 26px; }
.brand svg polygon { stroke: #fff; stroke-width: 2.5; stroke-linejoin: round; }
.left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.path { display: flex; white-space: nowrap; align-items: center; gap: 6px; min-width: 0; font-size: 13.5px; color: var(--ink-3); }
.path .sep { color: var(--line-2); }
.path b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.viewas { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--mist); font-size: 12.5px; }
.viewas button { height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 500; }
.viewas button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(16,24,40,.06); }
.me { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; }

.omni { position: relative; min-width: 0; }
.omni-box { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 8px 0 10px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line-2); transition: background .12s, border-color .12s, box-shadow .12s; }
.omni-box:hover { border-color: var(--ink-3); }
.omni-box > .av { width: 24px; height: 24px; }
.omni-box > .av svg { width: 11px; height: 14px; }
.omni.open .omni-box, .omni-box:focus-within { background: var(--paper); border-color: var(--line-2); box-shadow: var(--lift); }
.omni-box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 14.5px; }
.omni-box input::placeholder { color: var(--ink-3); }
.omni-box .icon { color: var(--ink-3); }
.kbd { font-size: 11.5px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 6px; line-height: 18px; background: var(--paper); }
.omni-pop { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--pop); max-height: min(70vh, 640px); overflow-y: auto; padding: 8px; animation: rise .18s cubic-bezier(.16,1,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.omni-group { padding: 6px 4px; }
.omni-group + .omni-group { border-top: 1px solid var(--line); }
.omni-group h4 { margin: 4px 8px 6px; font: 600 12px var(--body); color: var(--ink-3); }
.hit { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: start; width: 100%; padding: 8px; border: 0; border-radius: 9px; background: none; text-align: left; font-size: 13.5px; line-height: 1.45; }
.hit:hover, .hit[aria-selected="true"] { background: var(--mist); }
.hit .icon { margin-top: 2px; color: var(--ink-3); }
.hit small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 1px; }
.hit mark { background: #fff1bf; color: inherit; border-radius: 2px; padding: 0 1px; }
.hit.ask { grid-template-columns: 26px 1fr auto; align-items: center; }
.hit.ask .av { width: 24px; height: 24px; }
.hit.ask .av svg { width: 11px; height: 14px; }
.answer { padding: 12px 10px 6px; }
.answer .q { font-weight: 600; margin-bottom: 10px; }
.answer .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; }
.answer .who b { color: var(--ink); font-size: 13.5px; }
.tag { white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; line-height: 17px; }
.answer .text { font-size: 14.5px; line-height: 1.6; }
.answer .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.typing { display: inline-flex; gap: 3px; margin-left: 4px; }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ── Hive header ── */
.hivehead { max-width: 1240px; margin: 0 auto; padding: 28px 32px 0; }
.hh-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.hh-row h1 { font-size: 28px; line-height: 1.15; }
.hh-row .sub { margin-top: 6px; color: var(--ink-3); font-size: 14px; }
.people { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); }
.tabs { display: flex; gap: 26px; margin-top: 20px; border-bottom: 1px solid var(--line); }
.tabs button { position: relative; height: 42px; padding: 0; border: 0; background: none; font-size: 14px; font-weight: 500; color: var(--ink-3); display: inline-flex; align-items: center; gap: 7px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }
.tabs .c { font-size: 11.5px; font-weight: 600; color: var(--ink-3); background: var(--mist); border-radius: 9px; padding: 1px 7px; }
.tabs .lock { width: 13px; height: 13px; }

/* ── Home ── */
.home { max-width: 1240px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 48px; }
.brief { padding: 32px 0 96px; min-width: 0; }
.state { font-family: var(--display); font-size: 23px; line-height: 1.35; letter-spacing: -0.02em; font-weight: 500; color: var(--ink); max-width: 640px; }
.state em { font-style: normal; color: var(--ink-3); }
.meter { display: flex; gap: 3px; margin: 18px 0 8px; max-width: 420px; }
.meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--leaf); }
.sec { margin-top: 40px; }
.sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.sec h2 { font-size: 17px; letter-spacing: -0.015em; }
.step { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--line); }
.step .t { font-weight: 600; font-size: 14.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.step .d { grid-column: 1; color: var(--ink-2); font-size: 13.5px; }
.step .a { grid-row: 1 / span 2; grid-column: 2; }
.topic { margin-top: 22px; }
.topic h3 { font: 600 13.5px var(--body); color: var(--ink-3); margin-bottom: 4px; display: flex; gap: 10px; align-items: center; }
.claim { display: block; cursor: pointer; text-align: left; padding: 10px 12px; margin: 0 -12px; border-radius: 10px; font-size: 14.5px; line-height: 1.55; transition: background .12s; }
.claim:hover { background: var(--mist); }
.claim:hover .go { opacity: 1; }
.claim .go { opacity: 0; color: var(--blue-deep); font-size: 12.5px; font-weight: 600; margin-left: 6px; transition: opacity .12s; white-space: nowrap; }
.claim .refs { margin-top: 6px; pointer-events: none; }
.more { margin: 6px 0 0 -6px; }

/* Conversation panel */
.convo { position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px); display: flex; flex-direction: column; border-left: 1px solid var(--line); padding: 24px 0 16px 28px; }
.convo-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.convo-h h2 { font-size: 16px; }
.convo-h p { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.thread { flex: 1; overflow-y: auto; padding: 8px 4px 8px 0; }
.msg { display: grid; grid-template-columns: 30px 1fr; gap: 11px; padding: 12px 0; }
.by { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 12px; color: var(--ink-3); }
.by b { font-size: 13.5px; color: var(--ink); font-weight: 600; }
.msg .text { margin-top: 2px; font-size: 14px; line-height: 1.55; color: #2a2f35; white-space: pre-wrap; }
.day { text-align: center; font-size: 11.5px; color: var(--ink-3); margin: 6px 0; }
.composer { border: 1px solid var(--line-2); border-radius: 12px; background: var(--paper); box-shadow: 0 1px 2px rgba(16,24,40,.04); transition: border-color .12s, box-shadow .12s; }
.composer:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,124,246,.14); }
.composer textarea { display: block; width: 100%; min-height: 52px; max-height: 160px; resize: none; border: 0; outline: 0; background: none; padding: 12px 14px 4px; font-size: 14px; }
.composer .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px 8px 14px; }
.composer .hint { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.composer .hint .icon { width: 13px; height: 13px; }

/* ── Evidence split ── */
.split { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); min-height: calc(100vh - 64px); }
.claimside { padding: 28px 32px 64px; border-right: 1px solid var(--line); overflow-y: auto; }
.back { margin-left: -8px; }
.claimside .big { font-family: var(--display); font-size: 21px; line-height: 1.4; font-weight: 500; letter-spacing: -0.015em; margin: 18px 0 14px; }
.claimside h4 { margin: 22px 0 6px; font: 600 12.5px var(--body); color: var(--ink-3); }
.claimside .others { display: flex; flex-direction: column; gap: 6px; }
.claimside .others button { display: flex; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); text-align: left; font-size: 13px; }
.claimside .others button[aria-current="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.claimside .others button:hover { background: var(--mist); }
.decide { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.decided { margin-top: 10px; }
.viewer { background: var(--mist); padding: 28px 32px 64px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.vbar { width: 100%; max-width: 680px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-2); }
.vbar b { color: var(--ink); }
.page { width: 100%; max-width: 680px; aspect-ratio: 8.5 / 11; background: #fffefb; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 18px 40px -22px rgba(0,0,0,.3); padding: 56px 60px; font-family: var(--page); color: #2a2a2a; font-size: 14.5px; line-height: 1.7; overflow: hidden; animation: pagein .35s cubic-bezier(.16,1,.3,1); }
@keyframes pagein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.page .org { font-family: var(--body); font-size: 11.5px; letter-spacing: .02em; color: #8a8f96; display: flex; justify-content: space-between; border-bottom: 1px solid #ece9e2; padding-bottom: 10px; margin-bottom: 26px; }
.page .ln { height: 9px; border-radius: 5px; background: #efece6; margin: 13px 0; }
.page .hl { display: block; margin: 18px -10px; padding: 10px; border-radius: 4px; background: #fff1bf; box-shadow: 0 0 0 1px #f3d97a; font-size: 15.5px; color: #1f1f1f; }
.page .unread { display: grid; place-items: center; height: 60%; color: #8a8f96; font-family: var(--body); font-size: 13.5px; text-align: center; filter: blur(0); }

/* ── Documents / Report / Notes ── */
.pagewrap { max-width: 1040px; margin: 0 auto; padding: 28px 32px 96px; }
.pagewrap.read { max-width: 760px; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 10px 12px 10px 0; border-bottom: 1px solid var(--ink); }
.table td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.table .s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.table td.n, .table th.n { text-align: right; font-variant-numeric: tabular-nums; }
.table tbody tr { cursor: pointer; }
.table tbody tr:hover td { background: #fafbfc; }
.paper { margin-top: 20px; border: 1px solid var(--line); border-radius: 4px; padding: 48px 56px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 16px 40px -24px rgba(16,24,40,.22); }
.paper h2 { font-size: 24px; margin: 10px 0 8px; }
.paper h3 { font-size: 15px; margin: 26px 0 6px; }
.paper p { margin: 6px 0; }
.note { padding: 14px 0; border-bottom: 1px solid var(--line); }

/* ── Client home (phone first) ── */
.cl { max-width: 460px; margin: 0 auto; padding: 22px 20px 120px; }
.cl-who { display: flex; align-items: center; gap: 12px; }
.cl-who p { font-size: 13px; color: var(--ink-3); }
.cl-who b { display: block; font-size: 14.5px; color: var(--ink); }
.cl h1 { font-size: 26px; line-height: 1.2; margin: 22px 0 6px; }
.cl .lead { color: var(--ink-2); font-size: 15px; }
.cl .meter { max-width: none; margin-top: 16px; }
.cl-sec { margin-top: 30px; }
.cl-sec > h2 { font-size: 16px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; }
.cl-sec > h2 span { font: 500 12.5px var(--body); color: var(--ink-3); }
.ask-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ask-row p { font-size: 14.5px; line-height: 1.45; }
.ask-row small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.ask-row .btn { height: 44px; min-width: 76px; }
.ask-row.done p { color: var(--ink-3); }
.cl-ask { margin-top: 26px; display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--paper); text-align: left; color: var(--ink-3); font-size: 15px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
.cl-ask .av { width: 26px; height: 26px; }
.cl-ask .av svg { width: 12px; height: 15px; }
.cl-ask:hover { border-color: var(--ink-3); }
.cl .thread { overflow: visible; padding: 0; }
.privacy { display: flex; gap: 8px; align-items: flex-start; margin-top: 22px; font-size: 12.5px; color: var(--ink-3); }
.privacy .icon { width: 14px; height: 14px; margin-top: 2px; }
.sheet-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(20,26,34,.32); }
.sheet { position: fixed; z-index: 61; left: 50%; bottom: 0; transform: translateX(-50%); width: min(560px, 100vw); max-height: 88vh; display: flex; flex-direction: column; background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: var(--pop); animation: up .26s cubic-bezier(.16,1,.3,1); }
@keyframes up { from { transform: translate(-50%, 24px); opacity: .6; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
.sheet header h2 { font-size: 16px; }
.sheet .body { padding: 0 18px 12px; overflow-y: auto; }
.sheet .foot { padding: 10px 14px 16px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--pop); }


/* Honey graphics carry a thin ink edge (brand guide §5: honey is 1.8:1 on white) */
.dot.honey::before { box-shadow: 0 0 0 1px rgba(31,35,40,.55); }

/* ── Concept navigator (concept only — never in the app) ── */
.cnav { position: fixed; left: 12px; bottom: 12px; z-index: 90; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; max-width: calc(100vw - 24px); padding: 4px; border-radius: 12px; background: rgba(31,35,40,.94); color: #fff; font-size: 12px; box-shadow: var(--pop); }
.cnav > span { padding: 0 8px; color: #aeb4bb; font-weight: 600; }
.cnav button { height: 28px; padding: 0 9px; border: 0; border-radius: 8px; background: none; color: #dfe3e8; font-weight: 500; }
.cnav button:hover { background: rgba(255,255,255,.12); }
.cnav button[aria-pressed="true"], .cnav button[aria-pressed="true"]:hover { background: #fff; color: var(--ink); font-weight: 600; }

/* ── Signed-out top bar ── */
.fp-top { position: sticky; top: 0; z-index: 40; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; background: rgba(255,255,255,.9); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* ── Front page ── */
.hero { max-width: 720px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.hero-mark { width: 45px; height: 64px; }
.hero-mark.play polygon { transform-box: fill-box; transform-origin: center; animation: settle .8s cubic-bezier(.3,.9,.3,1) both; }
.hero-mark.play .c1 { --dx: -14px; --dy: -22px; animation-delay: .05s; }
.hero-mark.play .c2 { --dx: 22px; --dy: -6px; animation-delay: .17s; }
.hero-mark.play .c3 { --dx: 10px; --dy: 22px; animation-delay: .29s; }
.hero-mark.play .c4 { --dx: -22px; --dy: 8px; animation-delay: .41s; }
@keyframes settle { from { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(-40deg) scale(.6); } to { opacity: 1; transform: none; } }
.hero h1 { margin-top: 24px; font-size: clamp(34px, 5.4vw, 52px); line-height: 1.08; letter-spacing: -0.03em; }
.hero .lede { margin-top: 16px; max-width: 560px; font-size: 17px; line-height: 1.55; color: var(--ink-2); }
.seg { margin-top: 32px; display: inline-flex; gap: 4px; padding: 4px; background: var(--mist); border-radius: 11px; }
.seg button { height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: none; color: var(--ink-3); font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,.08); }
.ring { margin-top: 16px; width: 100%; padding: 2px; border-radius: 16px; background: var(--line-2); transition: box-shadow .2s; }
.ring:hover, .ring:focus-within { background: conic-gradient(from 200deg, var(--blue), var(--coral), var(--honey), var(--leaf), var(--blue)); box-shadow: var(--lift); }
.ring-in { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 14px; padding: 8px 8px 8px 18px; text-align: left; }
.ring-in input { flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: none; font-size: 16px; }
.ring-in input::placeholder { color: var(--ink-3); }
.ring-in .btn { height: 44px; padding: 0 20px; font-size: 15px; }
.ring-tools { margin-top: 12px; }
.hero .small { margin-top: 12px; font-size: 13.5px; line-height: 1.5; color: var(--ink-3); max-width: 520px; }
.hero .small + .small { margin-top: 4px; }
.band { background: var(--mist); padding: 72px 0; }
.fsec { padding-top: 80px; }
.band h2, .fsec h2 { font-size: 30px; line-height: 1.2; }
.band .sub2 { margin-top: 8px; font-size: 15px; color: var(--ink-2); }
.ex { margin-top: 28px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ex-h { padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 13px; color: var(--ink-3); }
.ex-h b { color: var(--ink); font-weight: 600; }
.ex-b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
.ex-l { padding: 28px 24px; min-width: 0; }
.ex-l .state { font-size: 22px; }
.ex-r { background: var(--mist); border-left: 1px solid var(--line); padding: 20px 24px 28px; min-width: 0; }
.ex .claim { width: calc(100% + 24px); border: 0; background: none; color: inherit; }
.ex .claim.on { background: var(--blue-wash); }
.ex .claim .tp { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.mrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.mini-page { max-width: 460px; margin: 14px auto 0; background: #fffefb; border-radius: 4px; box-shadow: 0 1px 3px rgba(16,24,40,.08), 0 16px 32px -18px rgba(16,24,40,.25); padding: 36px 36px 48px; font-family: var(--page); font-size: 13.5px; line-height: 1.6; color: #2a2f35; animation: pagein .35s cubic-bezier(.16,1,.3,1); }
.mini-page .iss { font-weight: 600; font-size: 15px; }
.mini-page .kind { color: #5b6168; }
.mini-page .meta-l { margin-top: 14px; }
.mini-page .lines { margin-top: 18px; border-top: 1px solid #d9d4c7; padding-top: 10px; }
.mini-page .row { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
.mini-page .row.hl { padding: 3px 6px; margin: 0 -6px; background: #fff1bf; box-shadow: 0 0 0 1px #f3d97a; border-radius: 3px; font-weight: 600; }
.ex-r .vbar { max-width: 460px; margin: 0 auto; }
.ex-r .ok { max-width: 460px; margin: 14px auto 0; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 40px; margin-top: 24px; }
.cols3 > div { border-top: 1px solid var(--ink); padding-top: 16px; }
.cols3 h3 { font-size: 19px; letter-spacing: -0.01em; }
.cols3 p { margin-top: 8px; font-size: 15px; color: var(--ink-2); }
.rows2 { margin-top: 20px; border-top: 1px solid var(--ink); }
.rows2 > div { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 24px; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.rows2 b { font-weight: 600; }
.rows2 p { color: var(--ink-2); }
.fsec .para { margin-top: 12px; max-width: 640px; font-size: 16px; line-height: 1.6; color: var(--ink-2); }
.closing { padding: 96px 0 72px; }
.closing .in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; border-top: 1px solid var(--line); padding-top: 40px; }
.closing .slogan { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.closing .slogan svg { width: 31px; height: 40px; }
.closing .btn { height: 44px; padding: 0 18px; font-size: 15px; }
.foot { border-top: 1px solid var(--line); }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 24px; padding-bottom: 24px; font-size: 13px; color: var(--ink-3); }
.foot a { color: var(--ink-3); }

/* ── Sign in ── */
.auth { max-width: 400px; margin: 0 auto; padding: 72px 20px 96px; }
.auth > svg { width: 31px; height: 40px; }
.auth h1 { margin-top: 20px; font-size: 28px; line-height: 1.15; }
.auth .lede { margin-top: 8px; color: var(--ink-2); font-size: 15px; }
.field { margin-top: 24px; display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13.5px; font-weight: 600; }
.field input { height: 44px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 10px; font-size: 16px; background: var(--paper); }
.field input:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,124,246,.14); }
.field input.code { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
.field .err { font-size: 13px; color: var(--coral-deep); }
.btn.wide { width: 100%; height: 44px; margin-top: 16px; font-size: 15px; }
.auth .alt { margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

/* ── Your hives (signed-in landing) ── */
.lp { max-width: 1040px; margin: 0 auto; padding: 40px 32px 96px; }
.lp-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
.lp-head > div { flex: 1 1 520px; min-width: 0; }
.lp-head h1 { font-size: 28px; line-height: 1.15; }
.lp-head .state { margin-top: 10px; font-size: 22px; }
.lp .tabs { margin-top: 24px; }
.hrow { display: grid; grid-template-columns: minmax(0, 1.6fr) 150px 170px minmax(0, 1fr); gap: 8px 20px; align-items: center; width: 100%; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.hrow:hover { background: var(--mist); box-shadow: -10px 0 0 var(--mist), 10px 0 0 var(--mist); }
.hrow .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.sq { width: 36px; height: 36px; border-radius: 8px; background: var(--mist); color: var(--ink-2); font-size: 12.5px; font-weight: 600; display: grid; place-items: center; flex: none; }
.hrow:hover .sq { background: var(--paper); }
.hrow .nm { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow .pp { display: block; margin-top: 1px; font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minimeter { display: flex; gap: 2px; width: 120px; }
.minimeter i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.minimeter i.on { background: var(--leaf); }
.hrow .prog .meta { margin-top: 5px; display: block; }
.hrow .sts { display: flex; flex-direction: column; gap: 3px; }
.hrow .act { text-align: right; font-size: 13px; color: var(--ink-3); }
.fv { max-width: 640px; margin: 0 auto; padding: 72px 24px 96px; }
.fv h1 { font-size: 28px; line-height: 1.15; }
.fv .state { margin-top: 12px; font-size: 22px; }
.fv .acts { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.fv .acts .btn.primary { height: 44px; padding: 0 18px; font-size: 15px; }
.fv .rows2 { margin-top: 56px; }
.fv .rows2 > div { grid-template-columns: 130px minmax(0, 1fr); font-size: 14.5px; }
.home.solo { grid-template-columns: minmax(0, 1fr); }
.home.solo .brief { max-width: 820px; }

/* ── Ask <assistant>: prominent entry points (all open the one box) ── */
.askbar { margin-top: 22px; max-width: 640px; }
.askbar-btn { display: flex; align-items: center; gap: 12px; width: 100%; height: 52px; padding: 0 12px 0 12px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--paper); color: var(--ink-2); font-size: 15px; text-align: left; box-shadow: 0 1px 2px rgba(16,24,40,.04); transition: border-color .12s, box-shadow .12s; }
.askbar-btn:hover { border-color: var(--ink-3); box-shadow: var(--lift); }
.askbar-btn .av { width: 28px; height: 28px; }
.askbar-btn .av svg { width: 13px; height: 16px; }
.askbar-btn b { color: var(--ink); font-weight: 600; }
.askbar-btn .kbd { margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); font-size: 13px; color: var(--ink-2); }
.chip:hover { background: var(--blue-wash); border-color: #c9d9fb; color: var(--blue-deep); }
.btn .av { width: 20px; height: 20px; }
.btn .av svg { width: 9px; height: 12px; }

/* ── Ask <assistant>: a chat (D23) ── */
.convo.has-tabs { padding-top: 18px; }
.ptabs { display: flex; gap: 4px; padding: 4px; background: var(--mist); border-radius: 11px; margin-bottom: 14px; }
.ptabs button { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
.ptabs button .av { width: 22px; height: 22px; font-size: 9.5px; }
.ptabs button .av svg { width: 10px; height: 13px; }
.ptabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,.08); }
.bot-h { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.bot-h > div { flex: 1; min-width: 0; }
.bot-h b { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin-right: 6px; }
.bot-h p { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.bot-av { position: relative; flex: none; }
.bot-av .av { width: 40px; height: 40px; }
.bot-av .av svg { width: 17px; height: 22px; }
.bot-av::after { content: ""; position: absolute; right: 0; bottom: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 0 2px var(--paper); }
.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 4px 14px 0; display: flex; flex-direction: column; gap: 12px; }
.bm { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; align-items: end; margin-right: 24px; }
.bm > .av { width: 28px; height: 28px; }
.bm > .av svg { width: 12px; height: 16px; }
.um { display: flex; justify-content: flex-end; margin-left: 52px; }
.bubble { padding: 10px 13px; border-radius: 16px; font-size: 14px; line-height: 1.55; min-width: 0; }
.bubble.bot { background: var(--mist); border-bottom-left-radius: 5px; color: #2a2f35; justify-self: start; }
.bubble.mine { background: var(--blue-wash); border-bottom-right-radius: 5px; color: var(--ink); }
.bubble .refs { margin-top: 8px; }
.bubble .bfoot { margin-top: 10px; }
.bubble .typing { margin: 4px 2px; }
.chat .chips { margin: 0 0 0 37px; }
.ro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 8px; margin-top: 12px; padding: 8px 6px 8px 12px; border-radius: 10px; background: var(--mist); font-size: 12.5px; color: var(--ink-2); }
.ro .btn { height: 28px; }
.composer.ai textarea { min-height: 46px; }
.composer.ai .btn.primary { width: 38px; padding: 0; }
.sarah-launch { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 50; display: flex; align-items: center; gap: 10px; width: min(560px, calc(100vw - 32px)); height: 54px; padding: 0 14px 0 10px; border: 1px solid var(--line-2); border-radius: 16px; background: var(--paper); box-shadow: var(--pop); font-size: 15px; color: var(--ink-2); text-align: left; }
.sarah-launch .av { width: 32px; height: 32px; }
.sarah-launch .av svg { width: 14px; height: 18px; }
.sarah-launch b { color: var(--ink); font-weight: 600; }
.home.narrow .brief { padding-bottom: 120px; }
.chat-sheet { height: min(88vh, 780px); padding: 16px 18px 14px; }
.chat-sheet .composer { flex: none; }

/* ── Left menu (D24): hive pages and Your hives, ≥ 1100px ── */
.hv { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.hv-main { min-width: 0; }
.side { position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px); overflow-y: auto; border-right: 1px solid var(--line); padding: 16px 12px 18px; display: flex; flex-direction: column; gap: 2px; background: var(--paper); }
.side-back { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin-bottom: 6px; border: 0; border-radius: 8px; background: none; color: var(--ink-3); font-size: 13px; font-weight: 500; align-self: flex-start; }
.side-back:hover { background: var(--hover); color: var(--ink); }
.side-back .icon { width: 14px; height: 14px; }
.side-id { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.side-id > span:last-child { min-width: 0; }
.side-id b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-id small { display: block; margin-top: 1px; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav button { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px; border: 0; border-radius: 9px; background: none; font-size: 14px; color: var(--ink-2); text-align: left; }
.side-nav button:hover { background: var(--hover); color: var(--ink); }
.side-nav button[aria-current="page"] { background: var(--mist); color: var(--ink); font-weight: 600; }
.side-nav .icon { color: var(--ink-3); }
.side-nav button[aria-current="page"] .icon { color: var(--ink); }
.side-nav .c { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink-3); background: var(--mist); border-radius: 9px; padding: 1px 7px; }
.side-nav button[aria-current="page"] .c { background: var(--paper); }
.side-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); }
.hv .hivehead, .hv .home, .hv .pagewrap { margin-left: 0; margin-right: auto; }
@media (min-width: 1100px) { .hv .hivehead .tabs, .hv .lp .tabs, .hv .hivehead .people { display: none; } .hv .hivehead { padding-bottom: 4px; } }
@media (max-width: 1099px) { .hv { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }

@media (max-width: 1099px) {
  .home { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .convo { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); padding: 24px 0 96px; }
  .convo .thread { overflow: visible; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .claimside { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .top { grid-template-columns: auto 1fr auto; height: 60px; padding: 0 12px; gap: 10px; }
  .path, .brand span, .kbd, .viewas .long { display: none; }
  .viewas button { padding: 0 8px; }
  .me { display: none; }
  .hs-sm { display: none; }
  .omni-box { height: 40px; }
  .chip { height: 40px; }
  .askbar-btn .kbd { display: none; }
  .omni-pop { position: fixed; left: 8px; right: 8px; top: 64px; }
  .hivehead, .home, .pagewrap { padding-left: 16px; padding-right: 16px; }
  .hh-row { flex-direction: column; align-items: flex-start; gap: 12px; }
  .hh-row h1 { font-size: 24px; }
  .tabs { gap: 20px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: none; height: 44px; }
  .state { font-size: 20px; }
  .step { grid-template-columns: 1fr; }
  .step .a { grid-row: auto; grid-column: 1; margin-top: 6px; }
  .btn { height: 44px; }
  .claimside, .viewer { padding: 20px 16px 40px; }
  .page { padding: 28px 24px; aspect-ratio: auto; min-height: 420px; }
  .paper { padding: 28px 20px; }
  .table thead { display: none; }
  .table tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .table td { display: block; padding: 0; border: 0; }
  .table td.hs { display: none; }
  .fp-top { padding: 0 16px; height: 60px; }
  .wrap { padding: 0 16px; }
  .hero { padding: 48px 16px 64px; }
  .ring-in { padding-left: 14px; }
  .ex-b { grid-template-columns: minmax(0, 1fr); }
  .ex-r { border-left: 0; border-top: 1px solid var(--line); padding: 20px 16px 24px; }
  .ex-l { padding: 24px 16px; }
  .ex-h { padding: 12px 16px; }
  .mini-page { padding: 24px 20px 32px; }
  .band { padding: 56px 0; }
  .fsec { padding-top: 56px; }
  .band h2, .fsec h2 { font-size: 26px; }
  .cols3 { grid-template-columns: minmax(0, 1fr); }
  .rows2 > div, .fv .rows2 > div { grid-template-columns: minmax(0, 1fr); }
  .closing { padding: 64px 0 48px; }
  .closing .slogan { font-size: 21px; }
  .auth { padding-top: 48px; }
  .lp { padding: 28px 16px 96px; }
  .lp-head .state, .fv .state { font-size: 20px; }
  .hrow { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
  .hrow .who { grid-column: 1; grid-row: 1; }
  .hrow .sts { grid-column: 2; grid-row: 1; align-items: flex-end; }
  .hrow .prog { grid-column: 1; grid-row: 2; padding-left: 48px; }
  .hrow .act { grid-column: 2; grid-row: 2; }
  .fv { padding: 48px 16px 96px; }
  .cnav > span { display: none; }
  .cnav { top: 70px; bottom: auto; left: auto; right: 8px; }
  .chat-sheet { width: 100vw; height: 100dvh; max-height: none; border-radius: 0; padding: 12px 14px 12px; }
  .bm { margin-right: 8px; }

  return `<div class="bm">${avatar("ai")}<div class="bubble bot">${body}</div></div>`;
}
const userMsg = (m) => `<div class="um"><div class="bubble mine"><p>${esc(m.text)}</p></div></div>`;
function sarahChat(where) {
  const ro = state.who === "staff" && state.viewClientQs;
  const thread = ro ? state.threads.client : state.threads[state.who];
  const clientQs = state.threads.client.filter((m) => m.from === "me").length;
  const head = `<div class="bot-h"><span class="bot-av">${avatar("ai")}</span><div><b>${P.assistant}</b><span class="tag">AI assistant</span><p>Answers only from the documents in this hive</p></div>${where === "sheet" ? `<button class="btn quiet" data-act="closesheet" aria-label="Close ${P.assistant}">${icon("x")}</button>` : ""}</div>`;
  const banner = ro ? `<div class="ro"><span>${esc(first(P.client))} asked these. Only your team can see them.</span><button class="btn text" data-act="myqs">Back to your chat</button></div>`
    : state.who === "staff" && clientQs ? `<div class="ro"><span>${esc(first(P.client))} has asked ${P.assistant} ${clientQs} ${clientQs === 1 ? "question" : "questions"}.</span><button class="btn text" data-act="clientqs">Read them</button></div>` : "";
  const intro = ro ? "" : `<div class="bm">${avatar("ai")}<div class="bubble bot"><p>${esc(sarahIntro())}</p></div></div>`;
  const quick = !ro && !thread.length ? `<div class="chips" aria-label="Suggested questions">${askSuggestions().map((s) => `<button class="chip" data-suggest="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : "";
  const msgs = thread.map((m, i) => (m.from === "me" ? userMsg(m) : botMsg(m, i, ro))).join("");
  const comp = ro ? "" : `<div class="composer ai"><label class="sr" for="sarahDraft">Ask ${P.assistant}</label><textarea id="sarahDraft" rows="1" placeholder="Ask ${P.assistant} about the documents…">${esc(state.sarahDraft)}</textarea>

  return `${head}${banner}<div class="chat" role="log" aria-label="Chat with ${P.assistant}">${intro}${quick}${msgs}</div>${comp}`;
}
function peopleBody() {
  const other = state.who === "client" ? first(P.staff) : first(P.client);

function sidePanel() {
  const own = state.who === "self";
  if (!isWide()) return own ? "" : `<aside class="convo" aria-label="Conversation">${peopleBody()}</aside>`;
  const tab = own ? "sarah" : state.side;
  const tabs = own ? "" : `<div class="ptabs" role="tablist" aria-label="Who you're talking to"><button role="tab" data-side="sarah" aria-selected="${tab === "sarah"}">${avatar("ai")}Ask ${P.assistant}</button><button role="tab" data-side="people" aria-selected="${tab === "people"}">${avatar("client")}${esc(first(P.client))}</button></div>`;
  return `<aside class="convo ${own ? "" : "has-tabs"}" aria-label="${tab === "sarah" ? "Ask " + P.assistant : "Conversation"}">${tabs}${tab === "sarah" ? sarahChat("panel") : peopleBody()}</aside>`;
}
const launcher = () => `<button class="sarah-launch" data-act="opensheet">${avatar("ai")}<span><b>Ask ${P.assistant}</b> about these documents</span></button>`;
function askSarah(q) {
  q = (q || "").trim(); if (!q) return;
  state.viewClientQs = false;
  const th = state.threads[state.who];
  th.push({ from: "me", text: q });
  const m = { from: "sarah", pending: true }; th.push(m);
  if (panelHasSarah()) state.side = "sarah"; else state.sheet = true;
  state.sarahDraft = ""; state.omni = ""; state.omniOpen = false; state.scrollChat = true;
  render(); $("#sarahDraft")?.focus();
  setTimeout(() => { Object.assign(m, reply(q), { pending: false }); state.scrollChat = true; render(); }, 1100);
}

function reply(q) {
  const t = q.toLowerCase();
  if (/eligible|qualify|should i|legal|advice|win/.test(t)) return { text: `That's a question for ${first(P.staff)}. I can only tell you what the documents say.`, handoff: true };
  if (/missing|still|need|request|2023/.test(t)) { const m = missing(); return m.length ? { text: `${m.length} records are still to come. The first: ${m[0].detail}`, ev: m[0].ev } : { text: "Nothing requested is still missing." }; }
  if (/transfer|left|money|7710|ellis/.test(t)) return { text: "Two transfers of $1,000.00 or more left the accounts with no matching deposit: $12,000.00 to account 7710 on March 14, 2024, and an $8,500.00 check to R. Ellis on August 2, 2025.", ev: ["e2", "e3"] };
  if (/savings|2022|open/.test(t)) return { text: "The earliest savings statement starts in January 2023, so the documents don't show whether the account was open in 2022.", ev: ["e15"] };
  return { text: "I couldn't find that in the documents.", handoff: true };
}

function landingSentence(rows) {
  const n = (g) => rows.filter((r) => r.group === g).length;

  const parts = [];
  if (r) parts.push(`${r} ${r === 1 ? "hive has" : "hives have"} things to review.`);
  if (w) parts.push(`${w} ${w === 1 ? "is" : "are"} waiting on documents.`);
  if (b) parts.push(`${b} ${b === 1 ? "is" : "are"} being read.`);
  return parts.length ? parts.join(" ") : "Everything is up to date.";
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, tr[data-ev], .claim[data-ev]");
  if (!t) {
    if (e.target.closest("[data-close-sheet]")) { state.sheet = false; return render(); }
    if (!e.target.closest(".omni") && state.omniOpen) { state.omniOpen = false; state.answer = null; render(); }
    return;
  }
  const d = t.dataset;
  if (d.side) { state.side = d.side; state.scrollChat = true; state.scrollThread = true; return render(); }
  if (d.who) { state.sheet = false; state.viewClientQs = false; state.screen = "hive"; state.who = d.who; state.evidence = null; state.tab = "home"; state.omniOpen = false; state.answer = null; state.omni = ""; render(); return scrollTo(0, 0); }
  if (d.go) return go(d.go);
  if (d.mode) { state.mode = d.mode; return render(); }
  if (d.exsel != null) { state.exSel = +d.exsel; return render(); }
  if (d.queue) { state.lpQueue = d.queue; return render(); }
  if (d.open) { if (d.open === "dana") { state.screen = "hive"; state.who = "staff"; state.tab = "home"; state.evidence = null; render(); return scrollTo(0, 0); } return toast("Concept: only Dana Ellis's hive is drawn."); }
  if (d.tab) { state.tab = d.tab; state.evidence = null; return render(); }
  if (d.ev) return openEvidence(d.ev, d.item);
  if (d.expand) { state.expanded[d.expand] = !state.expanded[d.expand]; return render(); }
  if (d.suggest) return askSarah(d.suggest);
  if (d.add) { state.sent[d.add] = true; return toast("Added. Priya's team will see it in Documents."); }
  switch (d.act) {
    case "start": {
      if (state.mode === "clients") { state.email = ($("#fpEmail")?.value || "").trim(); state.authFrom = "clients"; }
      else { state.desc = ($("#fpDesc")?.value || "").trim(); state.authFrom = "self"; }
      state.signinStep = "email"; state.authErr = ""; return go("signin", true);
    }
    case "signin": state.authFrom = null; state.signinStep = "email"; state.authErr = ""; return go("signin", true);
    case "addfiles": return toast("Concept: files you pick here are kept until you sign in.");
    case "sendcode": { const v = ($("#email")?.value || "").trim(); state.email = v; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { state.authErr = "Enter an email address like name@example.com."; render(); return $("#email")?.focus(); } state.authErr = ""; state.signinStep = "code"; render(); return $("#code")?.focus(); }
    case "verify": { const v = ($("#code")?.value || "").trim(); if (!v) { state.authErr = "Enter the code from the email."; render(); return $("#code")?.focus(); } state.authErr = ""; state.code = ""; if (state.authFrom === "clients") return go("first", true); if (state.authFrom === "self") { state.screen = "hive"; state.who = "self"; state.tab = "home"; state.evidence = null; render(); return scrollTo(0, 0); } return go("hives", true); }
    case "otheremail": state.signinStep = "email"; state.authErr = ""; render(); return $("#email")?.focus();
    case "resend": return toast("A new code is on its way.");
    case "totop": scrollTo(0, 0); return (state.mode === "clients" ? $("#fpEmail") : $("#fpDesc"))?.focus();
    case "newhive": return toast("Concept: New hive opens the New client screen (unchanged).");
    case "ownhive": state.screen = "hive"; state.who = "self"; state.tab = "home"; state.evidence = null; render(); return scrollTo(0, 0);
    case "cnav": state.cnavMin = !state.cnavMin; return render();
    case "ask": return ask(state.omni);
    case "newq": state.answer = null; state.omni = ""; render(); return $("#omni")?.focus();
    case "close": state.evidence = null; return render();
    case "focusomni": state.omniOpen = true; render(); return $("#omni")?.focus();
    case "askpage": { state.sarahDraft = `About the ${d.role} page ${d.page}: `; state.viewClientQs = false; state.sheet = true; state.scrollChat = true; render(); const el = $("#sarahDraft"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
    case "opensheet": state.sheet = true; state.scrollChat = true; render(); return $("#sarahDraft")?.focus();
    case "closesheet": state.sheet = false; return render();
    case "asksend": return askSarah($("#sarahDraft")?.value);
    case "clientqs": state.viewClientQs = true; state.scrollChat = true; return render();
    case "myqs": state.viewClientQs = false; state.scrollChat = true; return render();
    case "handoff": { const th = state.threads.client; const i = +d.i; th[i].handedOff = true; state.messages.push({ role: "client", text: th[i - 1].text, time: "Just now", fromAsk: true }); state.scrollThread = true; return toast(`Sent to ${first(P.staff)} in your messages.`); }
    case "request": { const m = missing(); state.draft = `Could you send these when you have a moment?\n` + m.map((x) => "• " + x.request).join("\n"); render(); return $("#draft")?.focus(); }
    case "askclient": { const it = S.exceptions.find((x) => x.id === d.item); state.evidence = null; state.draft = it.question || `Could you tell me more about this: ${it.title}?`; render(); return $("#draft")?.focus(); }
    case "send": { const v = $("#draft")?.value.trim(); if (!v) return $("#draft")?.focus(); state.messages.push({ role: state.who, text: v, time: "Just now" }); state.draft = ""; state.scrollThread = true; return render(); }
    case "note": { const v = $("#note")?.value.trim(); if (!v) return; state.notes.push({ who: "Priya Shah", when: "Just now", text: v }); state.noteDraft = ""; return render(); }
    case "print": return print();
  }
});
document.addEventListener("focusin", (e) => { if (e.target.id === "omni" && !state.omniOpen) { state.omniOpen = true; render(); } });
document.addEventListener("input", (e) => {
  if (e.target.id === "omni") { state.omni = e.target.value; state.answer = null; state.omniOpen = true; render(); }
  if (e.target.id === "draft") state.draft = e.target.value;
  if (e.target.id === "sarahDraft") state.sarahDraft = e.target.value;
  if (e.target.id === "lpFind") { state.lpQuery = e.target.value; render(); }
  if (e.target.id === "fpEmail" || e.target.id === "email") state.email = e.target.value;
  if (e.target.id === "fpDesc") state.desc = e.target.value;
  if (e.target.id === "note") state.noteDraft = e.target.value;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA" && ($("#omni") || $("#lpFind"))) { e.preventDefault(); ($("#omni") || $("#lpFind")).focus(); }
  if (e.key === "Enter" && (e.target.id === "fpEmail" || e.target.id === "fpDesc")) { e.preventDefault(); $('[data-act="start"]')?.click(); }
  if (e.key === "Enter" && e.target.id === "email") { e.preventDefault(); $('[data-act="sendcode"]')?.click(); }
  if (e.key === "Enter" && e.target.id === "code") { e.preventDefault(); $('[data-act="verify"]')?.click(); }
  if (e.key === "Escape" && state.sheet) { state.sheet = false; return render(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "sarahDraft") { e.preventDefault(); return askSarah(e.target.value); }
  if (e.key === "Escape") { if (state.omniOpen) { $("#omni")?.blur(); state.omniOpen = false; state.answer = null; render(); } else if (state.evidence) { state.evidence = null; render(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("claim") && e.target.dataset.ev) { e.preventDefault(); openEvidence(e.target.dataset.ev); }
  if (e.key === "Enter" && e.target.id === "omni" && state.omni.trim()) { e.preventDefault(); askSarah(state.omni); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "draft") { e.preventDefault(); $('[data-act="send"]')?.click(); }
});
render();
</script></body></html>
